            });
        }
      }, []);

      // Jalankan Timer per Tahapan saat berada di layar 'learning'

      const totalSeconds = timers.tab1 + timers.tab2 + timers.tab3 + timers.tab4;

      // ==========================================================================
      // LOGIKA DEDUPLIKASI REKAP NILAI TERTINGGI (TIDAK DOBEL NAMA)
      // ==========================================================================
      const highestRecordsByStudent = useMemo(() => {
        const map = {};
        records.forEach((rec) => {
          const nameKey = (rec.nama || "").trim().toUpperCase();
          if (!nameKey) return;
          const currentScore = Number(rec.nilai) || 0;
          if (!map[nameKey] || currentScore > Number(map[nameKey].nilai)) {
            map[nameKey] = rec;
          } else if (currentScore === Number(map[nameKey].nilai) && rec.foto && !map[nameKey].foto) {
            // Jika nilai sama, prioritaskan data yang memiliki foto catatan
            map[nameKey] = rec;
          }
        });
        return map;
      }, [records]);

      // Leaderboard 10 Teratas (Unik berdasarkan nilai tertinggi)
      const leaderboardTop10 = useMemo(() => {
        return Object.values(highestRecordsByStudent)
          .sort((a, b) => Number(b.nilai) - Number(a.nilai))
          .slice(0, 10);
      }, [highestRecordsByStudent]);

      // Daftar siswa yang belum mengerjakan & siswa yang perlu remidial (< 70)
      const studentStatusSummary = useMemo(() => {
        const belumMengerjakan = [];
        const perluRemidial = [];
        const sudahTuntas = [];

        students.forEach((stu) => {
          const key = stu.trim().toUpperCase();
          const best = highestRecordsByStudent[key];
          if (!best) {
            belumMengerjakan.push(stu);
          } else if (Number(best.nilai) < 70) {
            perluRemidial.push({ nama: stu, ...best });
          } else {
            sudahTuntas.push({ nama: stu, ...best });
          }
        });

        return { belumMengerjakan, perluRemidial, sudahTuntas };
      }, [students, highestRecordsByStudent]);

      // Handler Upload & Kompresi Foto Catatan ke Base64
      const handlePhotoUpload = (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (ev) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement("canvas");
            const maxW = 480;
            const scale = img.width > maxW ? maxW / img.width : 1;
            canvas.width = img.width * scale;
            canvas.height = img.height * scale;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            const compressedBase64 = canvas.toDataURL("image/jpeg", 0.65);
            setNotePhoto(compressedBase64);
            if (!noteUploadedBonus) {
              setNoteUploadedBonus(true);
              setXp((prev) => prev + 20);
            }
          };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      };

      // Handler Simulasi Klasifikasi Analog vs Digital (Tab 2)
      const handlePlaceCard = (targetCategory) => {
        if (!selectedCardId) {
          setSimFeedback({
            type: "info",
            msg: "Ketuk salah satu kartu alat di atas terlebih dahulu, lalu ketuk kotak Analog atau Digital!"
          });
          return;
        }
        const card = CLASSIFICATION_CARDS.find((c) => c.id === selectedCardId);
        const isCorrect = card.category === targetCategory;

        setCardPlacements((prev) => ({
          ...prev,
          [selectedCardId]: targetCategory
        }));

        if (isCorrect) {
          setXp((prev) => prev + 10);
          setSimFeedback({
            type: "success",
            msg: `Hebat! "${card.name}" memang termasuk teknologi ${targetCategory}. ${card.desc}`
          });
        } else {
          setSimFeedback({
            type: "error",
            msg: `Yuk, perhatikan lagi! "${card.name}" seharusnya masuk ke kategori ${card.category}. Ketuk kartu untuk memindahkannya!`
          });
        }
        setSelectedCardId(null);
      };

      // Handler Berburu Alat Digital di Peta (Tab 3)
      const handleCatchDigitalItem = (item) => {
        if (!foundHuntIds.includes(item.id)) {

            if (emptyIdx === -1) return prevTable;
            const updated = [...prevTable];
            updated[emptyIdx] = { tool: item.name, benefit: item.benefit };
            return updated;

        let pgCorrect = 0;
        QUIZ_PG.forEach((item) => {
          if (pgAnswers[item.id] === item.ans) pgCorrect++;
        });
        const pgScore = pgCorrect * 5;

        // 2. Hitung Skor Menjodohkan (Maks 15 poin: 5 pasang x 3 poin)
        let matchCorrect = 0;
        QUIZ_MATCH.forEach((item) => {
          if (matchPairs[item.id] === item.right) matchCorrect++;
        });
        const matchScore = matchCorrect * 3;

        // 3. Hitung Skor Benar/Salah (Maks 15 poin: 5 soal x 3 poin)
        let tfCorrect = 0;
        QUIZ_TF.forEach((item) => {
          if (tfAnswers[item.id] === item.ans) tfCorrect++;

          blankCorrect,
          simCorrect,
          huntFilled,

                        📌 Daftar Siswa Belum Mengerjakan ({studentStatusSummary.belumMengerjakan.length} Siswa)
                      </h3>
                      {studentStatusSummary.belumMengerjakan.length === 0 ? (
                        <p className="text-xs font-bold text-emerald-700">
                          ✔ Seluruh siswa sudah mengerjakan!
                        </p>
                      ) : (
                        <div className="flex flex-wrap gap-1.5">
                          {studentStatusSummary.belumMengerjakan.map((nama, i) => (
                            <span
                              key={nama}
                              className="bg-white px-2.5 py-1 rounded-lg border border-rose-200 text-[11px] font-bold text-rose-900"
                            >
                              {i + 1}. {nama}
                            </span>
                          ))}
                        </div>
                      )}
                    </div>

                    <div className="p-4 rounded-2xl bg-amber-50 border border-amber-300 space-y-2">
                      <h3 className="font-extrabold text-sm text-amber-900">
                        ⚠️ Daftar Siswa Perlu Remidial / Nilai &lt; 70 ({studentStatusSummary.perluRemidial.length} Siswa)
                      </h3>
                      {studentStatusSummary.perluRemidial.length === 0 ? (
                        <p className="text-xs font-bold text-emerald-700">
                          ✔ Tidak ada siswa yang remidial!
                        </p>
                      ) : (
                        <div className="flex flex-wrap gap-1.5">
                          {studentStatusSummary.perluRemidial.map((item, i) => (
                            <span
                              key={item.nama}
                              className="bg-white px-2.5 py-1 rounded-lg border border-amber-300 text-[11px] font-bold text-amber-900"
                            >
                              {i + 1}. {item.nama} (Nilai: {item.nilai})
                            </span>
                          ))}
                        </div>
                      )}
                    </div>
                  </div>

                  {/* Tabel Utama 30 Siswa (Nilai Tertinggi Masing-Masing + Foto Catatan Base64) */}
                  <div className="overflow-x-auto">
                    <table className="w-full text-left border-collapse text-xs">
                      <thead>
                        <tr className="bg-slate-800 text-white">
                          <th className="p-2.5 border">No</th>
                          <th className="p-2.5 border">Nama Siswa</th>
                          <th className="p-2.5 border text-center">Status</th>
                          <th className="p-2.5 border text-center">Nilai Tertinggi</th>
                          <th className="p-2.5 border text-center">Ketuntasan</th>
                          <th className="p-2.5 border text-center">Durasi</th>
                          <th className="p-2.5 border text-center">Foto Catatan (Base64)</th>
                          <th className="p-2.5 border text-center no-print">Aksi CRUD</th>
                        </tr>
                      </thead>
                      <tbody>
                        {students.map((stu, index) => {
                          const best = highestRecordsByStudent[stu.trim().toUpperCase()];
                          return (
                            <tr key={stu} className="border-b hover:bg-slate-50 print-break">
                              <td className="p-2.5 border font-bold text-center">{index + 1}</td>
                              <td className="p-2.5 border font-extrabold text-slate-800">{stu}</td>
                              <td className="p-2.5 border text-center">
                                {best ? (
                                  <span className="bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-full font-bold">
                                    Selesai
                                  </span>
                                ) : (
                                  <span className="bg-rose-100 text-rose-800 px-2 py-0.5 rounded-full font-bold">
                                    Belum
                                  </span>
                                )}
                              </td>
                              <td className="p-2.5 border text-center font-extrabold text-sm">
                                {best ? best.nilai : "-"}
                              </td>
                              <td className="p-2.5 border text-center font-bold">
                                {!best ? (
                                  <span className="text-slate-400">Belum Mengerjakan</span>
                                ) : Number(best.nilai) >= 70 ? (
                                  <span className="text-emerald-700">Tuntas</span>
                                ) : (
                                  <span className="text-rose-600 font-extrabold">Remidial (&lt;70)</span>
                                )}
                              </td>
                              <td className="p-2.5 border text-center">
                                {best ? best.durasi : "-"}
                              </td>
                              <td className="p-2.5 border text-center">
                                {best && best.foto ? (
                                  <img
                                    src={best.foto}
                                    alt={`Catatan ${stu}`}
                                    onClick={() => setPreviewImageModal({ nama: stu, foto: best.foto })}
                                    className="w-14 h-14 object-cover rounded-lg mx-auto border cursor-pointer hover:scale-110 transition"
                                  />
                                ) : (
                                  <span className="text-slate-400 italic">Tidak ada foto</span>
                                )}
                              </td>
                              <td className="p-2.5 border text-center no-print space-x-1">
                                {best && (
                                  <button
                                    onClick={() => handleDeleteRecordByStudent(stu)}
                                    className="px-2 py-1 rounded bg-amber-100 text-amber-800 font-bold hover:bg-amber-200"
                                    title="Reset Nilai Siswa"
                                  >
                                    Reset Nilai
                                  </button>
                                )}
                                <button
                                  onClick={() => handleDeleteStudent(stu)}
                                  className="px-2 py-1 rounded bg-rose-100 text-rose-700 font-bold hover:bg-rose-200"
                                  title="Hapus Siswa"
                                >
                                  Hapus
                                </button>
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}
          </main>

          {/* MODAL INPUT PIN GURU (PIN: 1234) */}
          {showPinModal && (
            <div className="no-print fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <form
                onSubmit={handleVerifyPin}
                className="bg-white rounded-3xl p-6 max-w-sm w-full shadow-2xl border-4 border-indigo-400 space-y-4"
              >
                <div className="flex items-center justify-between">
                  <h3 className="font-bold text-lg text-slate-800">🔐 Akses Dashboard Guru</h3>
                  <button
                    type="button"
                    onClick={() => {
                      setShowPinModal(false);
                      setPinError("");
                    }}
                    className="text-slate-400 hover:text-slate-700 font-bold"
                  >
                    ✕
                  </button>
                </div>
                <p className="text-xs text-slate-500">
                  Masukkan PIN Guru untuk membuka rekap nilai, foto catatan siswa, dan fitur cetak laporan.
                </p>
                <input
                  type="password"
                  value={pinInput}
                  onChange={(e) => setPinInput(e.target.value)}
                  placeholder="Masukkan PIN Guru..."
                  autoFocus
                  className="w-full p-3 rounded-2xl border-2 border-indigo-300 text-center font-extrabold tracking-widest text-lg"
                />
                {pinError && <p className="text-xs font-bold text-rose-600 text-center">{pinError}</p>}
                <button
                  type="submit"
                  className="btn-3d w-full py-3 rounded-2xl bg-indigo-600 text-white font-extrabold text-sm"
                >
                  BUKA DASHBOARD GURU
                </button>
              </form>
            </div>
          )}

          {/* MODAL PREVIEW FOTO CATATAN SISWA */}
          {previewImageModal && (
            <div
              onClick={() => setPreviewImageModal(null)}
              className="no-print fixed inset-0 bg-slate-900/75 z-50 flex items-center justify-center p-4"
            >
              <div className="bg-white rounded-3xl p-4 max-w-lg w-full space-y-3 text-center">
                <h4 className="font-extrabold text-slate-800">
                  📸 Foto Catatan: {previewImageModal.nama}
                </h4>
                <img
                  src={previewImageModal.foto}
                  alt="Catatan diperbesar"
                  className="max-h-96 mx-auto rounded-2xl border"
                />
                <button
                  onClick={() => setPreviewImageModal(null)}
                  className="px-5 py-2 rounded-xl bg-slate-800 text-white text-xs font-bold"
                >
                  Tutup Pratinjau
                </button>
              </div>
            </div>
          )}

          {/* FOOTER */}
          <footer className="no-print text-center text-xs text-slate-500 mt-8 px-4">
            APP KKA: DIGITAL EXPLORER • Kelas 5 SDN 4 Rambutan • {NAMA_GURU}
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>

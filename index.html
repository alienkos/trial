<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aplikasi Ujian STS 1 - SDN 4 Rambutan</title>
    
    <!-- Google Fonts: Nunito -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800;900&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Nunito', 'sans-serif'] },
                    colors: {
                        primary: '#3b82f6',
                        secondary: '#f43f5e',
                        accent: '#fbbf24',
                        success: '#22c55e'
                    }
                }
            }
        }
    </script>

    <!-- Custom CSS untuk Layar Penuh dan Tombol 3D -->
    <style>
        body, html, #root {
            margin: 0;
            padding: 0;
            height: 100%; /* FIX: Memastikan div root mengambil tinggi penuh */
            width: 100%;
            overflow: hidden; /* Mencegah scroll pada body utama */
            background-color: #f0f9ff;
        }
        
        /* Sembunyikan scrollbar tapi tetap bisa scroll pada container tertentu */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .btn-3d {
            transition: all 0.1s;
            border-bottom-width: 6px;
        }
        .btn-3d:active {
            transform: translateY(4px);
            border-bottom-width: 2px;
            margin-top: 4px;
        }
        .btn-3d-blue { background-color: #3b82f6; border-color: #1d4ed8; color: white; }
        .btn-3d-green { background-color: #22c55e; border-color: #15803d; color: white; }
        .btn-3d-red { background-color: #ef4444; border-color: #b91c1c; color: white; }
        .btn-3d-yellow { background-color: #eab308; border-color: #a16207; color: white; }
        .btn-3d-white { background-color: #ffffff; border-color: #d1d5db; color: #1f2937; }
        .btn-3d-white.selected { background-color: #bfdbfe; border-color: #3b82f6; border-width: 2px; border-bottom-width: 6px; }
    </style>

    <!-- React & ReactDOM CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel CDN untuk JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const soalData = [
            // BAGIAN A: PILIHAN GANDA
            {
                id: 1, type: 'pg',
                literasi: 'Teks Literasi 1: Kejayaan Bahari dan Pelayaran di Perairan Nusantara. Indonesia terletak di antara dua benua (Asia dan Australia) serta dua samudra (Samudra Hindia dan Samudra Pasifik). Letak geografis ini menjadikan Indonesia berada di persimpangan lalu lintas perdagangan dunia. Wilayah perairan Indonesia yang sangat luas menghubungkan ribuan pulau dari Sabang sampai Merauke. Sejak zaman dahulu, posisi ini dimanfaatkan oleh nelayan dan pedagang untuk mendistribusikan hasil bumi.',
                question: 'Berdasarkan Teks Literasi 1, keuntungan utama yang diperoleh masyarakat Indonesia dari letak geografisnya yang berada di jalur persimpangan dunia adalah...',
                options: [
                    'Indonesia tidak pernah mengalami perubahan cuaca ekstrem.',
                    'Wilayah Indonesia menjadi jalur strategis perdagangan Internasional sehingga mempercepat interaksi ekonomi dan budaya.',
                    'Seluruh wilayah daratan Indonesia dapat ditanami rempah-rempah tanpa memerlukan air.',
                    'Jumlah pulau di Indonesia berkurang karena dikelilingi oleh dua samudra.'
                ],
                answer: 1, poin: 1
            },
            {
                id: 2, type: 'pg',
                literasi: null,

                options: [
                    'Sebagian besar wilayah Indonesia terdiri dari daratan tinggi yang luas.',
                    'Sebagian besar wilayah Indonesia berupa perairan/lautan dan masyarakatnya memanfaatkan sumber daya laut untuk kehidupan.',
                    'Indonesia memiliki jumlah penduduk terkecil di benua Asia.',
                    'Mata pencaharian utama seluruh penduduk Indonesia adalah penambang batubara.'
                ],
                answer: 1, poin: 1
            },
            {
                id: 3, type: 'pg',
                literasi: 'Teks Literasi 2: Roda Ekonomi di Desa Rambutan. Pak Budi tinggal di daerah dataran tinggi Desa Rambutan yang subur. Ia menanam sayuran wortel dan kubis. Setelah panen, Pak Budi menjual hasil sayurannya kepada Pak Ahmad, seorang pedagang pengumpul yang mengendarai truk angkutan. Pak Ahmad menyalurkan sayuran tersebut ke pasar-pasar kota agar dapat dibeli oleh masyarakat perkotaan.',
                question: 'Berdasarkan Teks Literasi 2, jenis mata pencaharian Pak Budi sangat dipengaruhi oleh kondisi alam sekitarnya. Hal ini membuktikan bahwa...',
                options: [
                    'Bentang alam dataran tinggi sangat cocok untuk kegiatan pertanian hortikultura sehingga Indonesia dikenal sebagai negara agraris.',
                    'Dataran tinggi hanya bisa dimanfaatkan untuk pembuatan pelabuhan kapal laut.',

                    'Masyarakat dataran tinggi tidak membutuhkan bantuan pedagang untuk menyalurkan barang.'
                ],
                answer: 0, poin: 1
            },
            {
                id: 4, type: 'pg',
                literasi: 'Teks Literasi 2: Roda Ekonomi di Desa Rambutan. Pak Budi (Petani) -> Pak Ahmad (Pedagang Pengumpul) -> Masyarakat Kota (Pembeli).',
                question: 'Urutan kegiatan ekonomi yang dilakukan oleh Pak Budi, Pak Ahmad, dan masyarakat kota dalam Teks Literasi 2 berturut-turut adalah...',
                options: [
                    'Konsumsi -> Distribusi -> Produksi',
                    'Produksi -> Konsumsi -> Distribusi',
                    'Produksi -> Distribusi -> Konsumsi',
                    'Distribusi -> Produksi -> Konsumsi'
                ],
                answer: 2, poin: 1
            },
            {
                id: 5, type: 'pg',
                literasi: 'Studi Kasus Ekonomi: Pada musim kemarau panjang, hasil panen padi di daerah Rambutan mengalami penurunan drastis akibat kekurangan air. Hal ini menyebabkan harga beras di pasar lokal melonjak naik.',
                question: 'Solusi terbaik dan paling bijak yang dapat dilakukan oleh pelaku ekonomi daerah untuk mengatasi masalah tersebut adalah...',
                options: [
                    'Membiarkan sawah mengering dan berhenti melakukan kegiatan ekonomi.',
                    'Mengembangkan sistem irigasi hemat air serta memanfaatkan tanaman pangan alternatif lokal yang tahan kekeringan.',
                    'Membeli seluruh pasokan beras yang ada di pasar untuk disimpan sendiri.',
                    'Menjual lahan pertanian kepada pihak lain untuk dibangun pabrik semen.'
                ],
                answer: 1, poin: 1
            },
            {
                id: 6, type: 'pg',
                literasi: 'Teks Literasi 3: Kehidupan di Ekosistem Sawah. Di sebuah ekosistem sawah dekat sekolah, terdapat komponen abiotik seperti tanah, air, udara, dan cahaya matahari. Komponen-komponen ini mendukung tumbuhnya tanaman padi. Tanaman padi menjadi makanan bagi belalang dan tikus.',
                question: 'Berdasarkan Teks Literasi 3, contoh interaksi antara komponen abiotik dan komponen biotik yang saling memengaruhi adalah...',
                options: [
                    'Burung hantu berburu tikus pada malam hari.',
                    'Cahaya matahari dan air membantu tanaman padi melakukan proses fotosintesis.',
                    'Ular sawah memangsa tikus tanah.',
                    'Belalang hinggap di batang padi.'
                ],
                answer: 1, poin: 1
            },
            {
                id: 7, type: 'pg',
                literasi: 'Teks Literasi 3: Lanjutan Ekosistem Sawah. Belalang dan tikus dimakan oleh burung pemangsa dan ular sawah. Ketika hewan-hewan tersebut mati, bangkainya akan diuraikan oleh jamur dan bakteri.',
                question: 'Apabila petani di Desa Rambutan menggalakkan perburuan ular sawah secara berlebihan hingga populasi ular habis, dampak yang paling mungkin terjadi pada jaring-jaring makanan tersebut adalah...',
                options: [
                    'Populasi tanaman padi akan meningkat pesat.',
                    'Populasi tikus akan melonjak tajam sehingga merusak tanaman padi.',
                    'Jamur pengurai akan kehilangan tempat tinggal.',
                    'Jumlah air di sawah akan berkurang drastis.'
                ],
                answer: 1, poin: 1
            },
            {
                id: 8, type: 'pg',
                literasi: null,
                question: 'Peran bakteri dan jamur pengurai (dekomposer) dalam ekosistem pada Teks Literasi 3 sangat penting karena...',
                options: [
                    'Menghasilkan makanan utama bagi konsumen tingkat pertama.',
                    'Mengubah zat organik dari bangkai makhluk hidup menjadi nutrisi penyubur tanah bagi produsen.',
                    'Mencegah cahaya matahari masuk ke dalam tanah.',
                    'Membantu tikus berkembang biak lebih cepat.'
                ],
                answer: 1, poin: 1
            },
            {
                id: 9, type: 'pg',
                literasi: 'Teks Literasi 4: Kerusakan Hutan dan Keseimbangan Alam. Hutan merupakan rumah bagi berbagai jenis hewan dan tumbuhan. Pohon-pohon di hutan berperan penting menyerap air hujan dan menghasilkan oksigen. Namun, baru-baru ini terjadi penebangan hutan secara liar untuk pembukaan lahan perkebunan. Akibatnya, saat musim hujan tiba, sering terjadi bencana tanah longsor dan banjir.',
                question: 'Berdasarkan Teks Literasi 4, evaluasi yang tepat mengenai dampak jangka panjang dari alih fungsi hutan secara liar adalah...',
                options: [
                    'Keseimbangan ekosistem terganggu, hilangnya habitat hewan, dan meningkatnya risiko bencana alam.',
                    'Tanah menjadi makin subur dan keanekaragaman hayati makin bertambah.',
                    'Jumlah air bersih di permukiman akan melimpah sepanjang tahun.',
                    'Suhu udara di sekitar perkebunan akan menjadi jauh lebih sejuk.'
                ],
                answer: 0, poin: 1
            },
            {
                id: 10, type: 'pg',
                literasi: null,
                question: 'Pasangan tindakan manusia berikut yang paling tepat untuk memulihkan kembali keseimbangan ekosistem hutan yang rusak adalah...',
                options: [
                    'Membakar sisa-sisa pohon dan membangun pemukiman baru.',
                    'Melakukan reboisasi (penanaman kembali) dan menerapkan sistem tebang pilih.',
                    'Mengubah seluruh kawasan hutan menjadi area pertambangan batubara.',
                    'Membuang sampah plastik di area bekas penebangan.'
                ],
                answer: 1, poin: 1
            },
            // BAGIAN B: MENJODOHKAN
            {
                id: 11, type: 'menjodohkan', literasi: null,
                question: 'Negara yang memiliki wilayah perairan luas dan memanfaatkan potensi lautnya.',
                options: ['A. Komponen Abiotik', 'B. Konsumsi', 'C. Negara Maritim', 'D. Distribusi', 'E. Produsen (Tumbuhan)'],
                answer: 'C. Negara Maritim', poin: 2
            },
            {
                id: 12, type: 'menjodohkan', literasi: null,
                question: 'Kegiatan menyalurkan barang hasil produksi dari produsen ke tangan konsumen.',
                options: ['A. Komponen Abiotik', 'B. Konsumsi', 'C. Negara Maritim', 'D. Distribusi', 'E. Produsen (Tumbuhan)'],
                answer: 'D. Distribusi', poin: 2
            },
            {
                id: 13, type: 'menjodohkan', literasi: null,
                question: 'Unsur tak hidup di dalam ekosistem seperti air, tanah, udara, dan cahaya matahari.',
                options: ['A. Komponen Abiotik', 'B. Konsumsi', 'C. Negara Maritim', 'D. Distribusi', 'E. Produsen (Tumbuhan)'],
                answer: 'A. Komponen Abiotik', poin: 2
            },
            {
                id: 14, type: 'menjodohkan', literasi: null,
                question: 'Organisme dalam ekosistem yang mampu membuat makanannya sendiri melalui fotosintesis.',
                options: ['A. Komponen Abiotik', 'B. Konsumsi', 'C. Negara Maritim', 'D. Distribusi', 'E. Produsen (Tumbuhan)'],
                answer: 'E. Produsen (Tumbuhan)', poin: 2
            },
            {
                id: 15, type: 'menjodohkan', literasi: null,
                question: 'Kegiatan menggunakan atau menghabiskan nilai guna barang dan jasa untuk memenuhi kebutuhan.',
                options: ['A. Komponen Abiotik', 'B. Konsumsi', 'C. Negara Maritim', 'D. Distribusi', 'E. Produsen (Tumbuhan)'],
                answer: 'B. Konsumsi', poin: 2
            },
            // BAGIAN C: BENAR / SALAH
            {
                id: 16, type: 'bs', 
                literasi: 'Stimulus Literasi Ringkas: Indonesia kaya akan sumber daya alam, baik di darat maupun laut. Manusia membutuhkan sumber daya ini untuk melangsungkan kegiatan ekonomi. Namun, jika eksploitasi alam dilakukan tanpa perhitungan, ekosistem akan rusak dan mengancam kehidupan masa depan.',
                question: 'Letak geografis Indonesia yang dihimpit dua samudra tidak memberikan pengaruh terhadap iklim maupun kegiatan perdagangan masyarakat.',
                answer: 'S', poin: 4 
            },
            {
                id: 17, type: 'bs', literasi: null,
                question: 'Petani yang menanam padi di sawah dikategorikan sebagai pelaku kegiatan ekonomi produksi.',
                answer: 'B', poin: 4
            },
            {
                id: 18, type: 'bs', literasi: null,
                question: 'Membuang limbah rumah tangga ke sungai dapat merusak komponen abiotik air dan mengganggu kehidupan ikan di dalam ekosistem.',
                answer: 'B', poin: 4
            },
            {
                id: 19, type: 'bs', literasi: null,
                question: 'Jika populasi katak pemakan belalang di sawah punah, maka populasi belalang akan makin berkurang.',
                answer: 'S', poin: 4
            },
            {
                id: 20, type: 'bs', literasi: null,
                question: 'Menjaga keseimbangan ekosistem dapat dilakukan dengan cara menerapkan prinsip pemanfaatan sumber daya alam secara bijak dan berkelanjutan.',
                answer: 'B', poin: 4
            },
        ];

        const App = () => {
            const [hasStarted, setHasStarted] = useState(false);
            const [nama, setNama] = useState('');
            const [absen, setAbsen] = useState('');
            
            const [currentIndex, setCurrentIndex] = useState(0);
            const [answers, setAnswers] = useState({});
            const [alasanBS, setAlasanBS] = useState({});
            const [isFinished, setIsFinished] = useState(false);
            
            const [timeLeft, setTimeLeft] = useState(120);
            const [isTtsEnabled, setIsTtsEnabled] = useState(true);

            const speakText = (textToRead) => {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    if (isTtsEnabled && hasStarted && !isFinished) {
                        const utterance = new SpeechSynthesisUtterance(textToRead);
                        utterance.lang = 'id-ID';
                        utterance.rate = 0.9;
                        window.speechSynthesis.speak(utterance);
                    }
                }
            };

            useEffect(() => {
                if (hasStarted && !isFinished) {
                    const q = soalData[currentIndex];
                    let text = '';
                    
                    if (q.literasi) text += q.literasi + ". ";
                    text += "Pertanyaan: " + q.question + ". ";
                    
                    if (q.type === 'pg') {
                        text += "Pilihan jawabannya adalah: ";
                        q.options.forEach((opt, i) => {
                            text += `Pilihan ${String.fromCharCode(65 + i)}: ${opt}. `;
                        });
                    } else if (q.type === 'menjodohkan') {
                        text += "Pilih pasangan yang tepat dari pilihan berikut: ";
                        q.options.forEach(opt => { text += opt + ". "; });
                    } else if (q.type === 'bs') {
                        text += "Tentukan apakah pernyataan ini Benar atau Salah, lalu tuliskan alasan singkatmu.";
                    }
                    
                    speakText(text);
                }
                
                return () => {
                    if('speechSynthesis' in window) window.speechSynthesis.cancel();
                };
            }, [currentIndex, hasStarted, isFinished, isTtsEnabled]);

            useEffect(() => {
                let timerId;
                if (hasStarted && !isFinished) {
                    if (timeLeft > 0) {
                        timerId = setTimeout(() => setTimeLeft(prev => prev - 1), 1000);
                    } else {
                        handleNext();
                    }
                }
                return () => clearTimeout(timerId);
            }, [timeLeft, hasStarted, isFinished]);

            const handleStart = (e) => {
                e.preventDefault();
                if(nama && absen) {
                    setHasStarted(true);
                    setTimeLeft(120);
                    if('speechSynthesis' in window) {
                        const initAudio = new SpeechSynthesisUtterance('');
                        window.speechSynthesis.speak(initAudio);
                    }
                }
            };

            const handleNext = () => {
                if (currentIndex < soalData.length - 1) {
                    setCurrentIndex(prev => prev + 1);
                    setTimeLeft(120);
                } else {
                    setIsFinished(true);
                }
            };

            const handlePrev = () => {
                if (currentIndex > 0) {
                    setCurrentIndex(prev => prev - 1);
                    setTimeLeft(120);
                }
            };

            const handleAnswer = (answerVal) => {
                setAnswers({...answers, [currentIndex]: answerVal});
            };

            const handleAlasan = (val) => {
                setAlasanBS({...alasanBS, [currentIndex]: val});
            };

            const toggleTTS = () => {
                setIsTtsEnabled(!isTtsEnabled);
                if(isTtsEnabled && 'speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                } else if (!isTtsEnabled) {
                    const q = soalData[currentIndex];
                    speakText(q.question); 
                }
            };

            const formatTime = (seconds) => {
                const m = Math.floor(seconds / 60).toString().padStart(2, '0');
                const s = (seconds % 60).toString().padStart(2, '0');
                return `${m}:${s}`;
            };

            const calculateScore = () => {
                let totalSkor = 0;
                soalData.forEach((q, index) => {
                    if (q.type === 'pg' && answers[index] === q.answer) totalSkor += q.poin;
                    if (q.type === 'menjodohkan' && answers[index] === q.answer) totalSkor += q.poin;
                    if (q.type === 'bs') {
                        if (answers[index] === q.answer) totalSkor += 2; 
                        if (alasanBS[index] && alasanBS[index].trim().length > 5) totalSkor += 2; 
                    }
                });
                return Math.round((totalSkor / 40) * 100);
            };

            if (!hasStarted) {
                return (
                    <div className="flex flex-col items-center justify-center h-[100dvh] w-full p-4">
                        <div className="bg-white p-8 rounded-3xl shadow-xl w-full max-w-md border-4 border-blue-200">
                            <h1 className="text-2xl md:text-3xl font-black text-blue-600 text-center mb-2">UJIAN STS 1 IPAS</h1>
                            <p className="text-center font-bold text-gray-500 mb-6">Kelas 5 SDN 4 Rambutan</p>
                            
                            <form onSubmit={handleStart} className="flex flex-col gap-4">
                                <div>
                                    <label className="font-bold text-gray-700 block mb-1">Nama Lengkap</label>
                                    <input required type="text" value={nama} onChange={e => setNama(e.target.value)} 
                                        className="w-full p-3 rounded-xl border-2 border-gray-300 focus:border-blue-500 focus:outline-none font-semibold text-lg" 
                                        placeholder="Ketik namamu..." />
                                </div>
                                <div>
                                    <label className="font-bold text-gray-700 block mb-1">Nomor Absen</label>
                                    <input required type="number" value={absen} onChange={e => setAbsen(e.target.value)} 
                                        className="w-full p-3 rounded-xl border-2 border-gray-300 focus:border-blue-500 focus:outline-none font-semibold text-lg" 
                                        placeholder="Ketik absen..." />
                                </div>
                                <button type="submit" className="btn-3d btn-3d-blue py-4 rounded-2xl font-black text-xl mt-4">
                                    MULAI UJIAN
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            if (isFinished) {
                const nilai = calculateScore();
                return (
                    <div className="flex flex-col items-center justify-center h-[100dvh] w-full p-4">
                        <div className="bg-white p-8 rounded-3xl shadow-xl w-full max-w-md border-4 border-green-200 text-center">
                            <h2 className="text-3xl font-black text-green-600 mb-2">SELESAI!</h2>
                            <div className="bg-green-50 rounded-2xl p-6 my-6 border-2 border-green-100">
                                <p className="text-gray-500 font-bold mb-1">Nilai Akhir (Estimasi)</p>
                                <p className="text-6xl font-black text-green-500">{nilai}</p>
                            </div>
                            <div className="text-left mb-6 font-bold text-gray-600 bg-gray-50 p-4 rounded-xl">
                                <p>Nama: <span className="text-gray-800">{nama}</span></p>
                                <p>Absen: <span className="text-gray-800">{absen}</span></p>
                            </div>
                            <button onClick={() => window.location.reload()} className="btn-3d btn-3d-yellow w-full py-3 rounded-xl font-bold text-lg">
                                Kembali ke Awal
                            </button>
                        </div>
                    </div>
                );
            }

            const q = soalData[currentIndex];

            return (
                /* FIX: Menggunakan h-[100dvh] dan overflow-hidden agar kotak tidak melebihi tinggi layar pada layar lebar */
                <div className="flex flex-col h-[100dvh] w-full max-w-3xl mx-auto bg-white shadow-2xl relative overflow-hidden">
                    
                    {/* Header: Progress, Timer, TTS Toggle */}
                    <div className="flex justify-between items-center p-3 sm:p-4 bg-blue-600 text-white shadow-md z-10 shrink-0">
                        <div className="font-black text-lg sm:text-xl bg-blue-800 px-3 py-1 rounded-lg border-2 border-blue-400">
                            {currentIndex + 1} / {soalData.length}
                        </div>
                        
                        <div className="flex items-center gap-2">
                            <button onClick={toggleTTS} 
                                className={`p-2 rounded-lg font-bold border-2 transition-colors ${isTtsEnabled ? 'bg-green-400 border-green-200' : 'bg-red-400 border-red-200'}`}>
                                {isTtsEnabled ? '🔊 Suara ON' : '🔈 Suara OFF'}
                            </button>
                            <div className={`font-black text-xl sm:text-2xl px-3 py-1 rounded-lg border-2 ${timeLeft <= 10 ? 'bg-red-500 border-red-300 animate-pulse' : 'bg-yellow-400 border-yellow-200 text-yellow-900'}`}>
                                ⏱ {formatTime(timeLeft)}
                            </div>
                        </div>
                    </div>

                    {/* Content Area - FIX: Menggunakan min-h-0 agar flexbox tidak melar paksa keluar layar */}
                    <div className="flex-1 flex flex-col p-3 sm:p-5 overflow-hidden gap-3 min-h-0">
                        
                        {/* Box Literasi */}
                        {q.literasi && (
                            <div className="bg-yellow-50 border-2 border-yellow-300 rounded-xl p-3 sm:p-4 overflow-y-auto no-scrollbar shrink max-h-[30vh] border-l-8 border-l-yellow-400">
                                <p className="text-sm sm:text-base font-semibold text-gray-800 leading-relaxed text-justify">
                                    {q.literasi}
                                </p>
                            </div>
                        )}

                        {/* Box Pertanyaan */}
                        <div className="bg-blue-50 border-2 border-blue-200 rounded-xl p-3 sm:p-4 shrink-0 shadow-sm">
                            <h3 className="font-extrabold text-base sm:text-lg lg:text-xl text-blue-900 leading-snug">
                                {q.question}
                            </h3>
                        </div>

                        {/* Box Pilihan Jawaban - FIX: Menggunakan min-h-0 agar list opsi bisa discroll secara internal jika terlalu banyak */}
                        <div className="flex-1 overflow-y-auto no-scrollbar flex flex-col gap-2 sm:gap-3 pb-2 min-h-0">
                            {q.type === 'pg' && q.options.map((opt, i) => (
                                <button key={i} 
                                    onClick={() => handleAnswer(i)}
                                    className={`btn-3d w-full text-left p-3 sm:p-4 rounded-xl font-bold text-sm sm:text-base border-2 
                                        ${answers[currentIndex] === i ? 'btn-3d-white selected' : 'btn-3d-white'}`}>
                                    <span className="inline-block bg-gray-200 rounded-lg px-2 py-1 mr-2 text-gray-700 border border-gray-300">
                                        {String.fromCharCode(65 + i)}
                                    </span>
                                    {opt}
                                </button>
                            ))}

                            {q.type === 'menjodohkan' && (
                                <div className="flex flex-col gap-2 sm:gap-3">
                                    <p className="font-bold text-gray-600 mb-1 text-sm">Pilih jawaban pasangan yang tepat:</p>
                                    {q.options.map((opt, i) => (
                                        <button key={i} 
                                            onClick={() => handleAnswer(opt)}
                                            className={`btn-3d w-full text-left p-3 sm:p-4 rounded-xl font-bold text-sm sm:text-base border-2 
                                                ${answers[currentIndex] === opt ? 'btn-3d-white selected' : 'btn-3d-white'}`}>
                                            {opt}
                                        </button>
                                    ))}
                                </div>
                            )}

                            {q.type === 'bs' && (
                                <div className="flex flex-col gap-3 h-full">
                                    <div className="flex gap-3 shrink-0">
                                        <button onClick={() => handleAnswer('B')}
                                            className={`flex-1 btn-3d py-3 sm:py-4 rounded-xl font-black text-lg border-2 ${answers[currentIndex] === 'B' ? 'btn-3d-green border-b-2 mt-1' : 'btn-3d-white'}`}>
                                            BENAR (B)
                                        </button>
                                        <button onClick={() => handleAnswer('S')}
                                            className={`flex-1 btn-3d py-3 sm:py-4 rounded-xl font-black text-lg border-2 ${answers[currentIndex] === 'S' ? 'btn-3d-red border-b-2 mt-1' : 'btn-3d-white'}`}>
                                            SALAH (S)
                                        </button>
                                    </div>
                                    <textarea 
                                        placeholder="Tuliskan alasan singkat logismu di sini..."
                                        className="flex-1 w-full p-3 rounded-xl border-2 border-gray-300 focus:border-blue-500 focus:outline-none font-semibold text-sm sm:text-base resize-none min-h-[80px]"
                                        value={alasanBS[currentIndex] || ""}
                                        onChange={(e) => handleAlasan(e.target.value)}
                                    ></textarea>
                                </div>
                            )}
                        </div>
                    </div>

                    {/* Footer / Navigasi */}
                    <div className="flex gap-3 p-3 sm:p-4 bg-gray-100 border-t-2 border-gray-200 shrink-0 z-10">
                        <button onClick={handlePrev} disabled={currentIndex === 0}
                            className={`flex-1 btn-3d py-3 rounded-xl font-bold text-sm sm:text-base ${currentIndex === 0 ? 'bg-gray-300 text-gray-500 border-gray-400 cursor-not-allowed border-b-2 mt-1' : 'btn-3d-white'}`}>
                            ⬅️ KEMBALI
                        </button>
                        <button onClick={handleNext}
                            className="flex-1 btn-3d btn-3d-blue py-3 rounded-xl font-black text-sm sm:text-base">
                            {currentIndex === soalData.length - 1 ? 'SELESAI 🏁' : 'LANJUT ➡️'}
                        </button>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asesmen Bahasa Indonesia - Layar PID</title>
    
    <!-- Google Fonts: Nunito -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Custom CSS untuk efek Gamified & Tombol 3D -->
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #f0f9ff; /* Light blue background */
            background-image: radial-gradient(#bae6fd 2px, transparent 2px);
            background-size: 30px 30px;
        }

        /* 3D Button Base */
        .btn-3d {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            border-radius: 1rem; /* rounded-2xl */
            transition: all 0.1s ease;
            top: 0;
            user-select: none;
            cursor: pointer;
            border: 2px solid rgba(0,0,0,0.1);
        }

        /* Blue Button */
        .btn-3d-blue {
            background-color: #3b82f6;
            color: white;
            box-shadow: 0 6px 0 #1d4ed8;
        }
        .btn-3d-blue:active {
            top: 6px;
            box-shadow: 0 0px 0 #1d4ed8;
        }

        /* Green Button */
        .btn-3d-green {
            background-color: #22c55e;
            color: white;
            box-shadow: 0 6px 0 #15803d;
        }
        .btn-3d-green:active {
            top: 6px;
            box-shadow: 0 0px 0 #15803d;
        }

        /* Yellow Button */
        .btn-3d-yellow {
            background-color: #eab308;
            color: #451a03;
            box-shadow: 0 6px 0 #a16207;
        }
        .btn-3d-yellow:active {
            top: 6px;
            box-shadow: 0 0px 0 #a16207;
        }

        /* Option Button (Unselected) */
        .btn-option {
            background-color: white;
            color: #334155;
            box-shadow: 0 4px 0 #cbd5e1;
            border: 2px solid #e2e8f0;
            text-align: left;
            justify-content: flex-start;
        }
        .btn-option:active {
            top: 4px;
            box-shadow: 0 0px 0 #cbd5e1;
        }

        /* Option Button (Selected) */
        .btn-option-selected {
            background-color: #fef08a; /* yellow-200 */
            color: #854d0e;
            border-color: #eab308;
            box-shadow: 0 4px 0 #ca8a04;
        }
        .btn-option-selected:active {
            top: 4px;
            box-shadow: 0 0px 0 #ca8a04;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 1.5rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border: 4px solid white;
        }

        /* Animasi timer berkedip saat kritis */
        @keyframes pulse-red {
            0%, 100% { color: #ef4444; transform: scale(1); }
            50% { color: #991b1b; transform: scale(1.05); }
        }
        .timer-critical {
            animation: pulse-red 1s infinite;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- Container Utama -->
    <div class="w-full max-w-4xl min-h-[600px] flex flex-col" id="app-container">
        
        <!-- ================= START SCREEN ================= -->
        <div id="start-screen" class="glass-panel w-full p-8 md:p-12 flex flex-col items-center text-center my-auto transition-opacity duration-300">
            <div class="mb-6 inline-block bg-blue-100 text-blue-800 px-4 py-1 rounded-full font-bold text-sm tracking-widest uppercase">
                Ujian Interaktif
            </div>
            <h1 class="text-4xl md:text-5xl font-black text-slate-800 mb-2 leading-tight">Asesmen<br><span class="text-blue-600">Bahasa Indonesia</span></h1>
            <p class="text-slate-500 font-semibold mb-8 text-lg">Kelas V / Semester I • Waktu: 90 Menit</p>

            <div class="w-full max-w-md bg-slate-50 p-6 rounded-2xl border-2 border-slate-100 mb-8 text-left">
                <div class="mb-4">
                    <label class="block text-slate-700 font-bold mb-2 ml-1">Nama Siswa</label>
                    <input type="text" id="input-nama" placeholder="Masukkan namamu..." class="w-full px-4 py-3 rounded-xl border-2 border-slate-200 focus:border-blue-500 focus:outline-none focus:ring-4 focus:ring-blue-100 transition-all font-semibold text-slate-700">
                </div>
                <div>
                    <label class="block text-slate-700 font-bold mb-2 ml-1">No. Absen</label>
                    <input type="number" id="input-absen" placeholder="Contoh: 12" class="w-full px-4 py-3 rounded-xl border-2 border-slate-200 focus:border-blue-500 focus:outline-none focus:ring-4 focus:ring-blue-100 transition-all font-semibold text-slate-700">
                </div>
            </div>

            <button onclick="startExam()" class="btn-3d btn-3d-green w-full max-w-md py-4 text-2xl">
                🚀 Mulai Ujian!
            </button>
            
            <div class="mt-6 text-sm font-bold text-slate-400 bg-white px-4 py-2 rounded-xl inline-block border-2 border-slate-100">
                PETUNJUK: Setiap soal berbatas waktu 2 Menit!
            </div>
        </div>

        <!-- ================= EXAM SCREEN ================= -->
        <div id="exam-screen" class="hidden w-full h-full flex flex-col flex-grow">
            <!-- Header: Timer & Info -->
            <div class="flex justify-between items-center mb-4 px-2">
                <div class="bg-white px-4 py-2 rounded-xl shadow-sm border-2 border-slate-200 font-bold text-slate-600">
                    Soal <span id="soal-counter" class="text-blue-600 text-lg">1/20</span>
                </div>
                <!-- Timer Display -->
                <div class="bg-white px-6 py-2 rounded-2xl shadow-sm border-4 border-slate-200 flex items-center gap-2">
                    <svg class="w-6 h-6 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    <span id="timer-display" class="font-black text-3xl text-slate-700 tracking-wider">02:00</span>
                </div>
            </div>

            <!-- Content Area -->
            <div class="glass-panel flex-grow p-6 md:p-8 flex flex-col overflow-hidden relative">
                
                <div class="overflow-y-auto flex-grow pr-2 pb-4 custom-scrollbar" id="question-container">
                    <!-- Teks Stimulus (jika ada) -->
                    <div id="stimulus-container" class="mb-6 p-5 bg-blue-50 border-l-4 border-blue-500 rounded-r-2xl rounded-bl-2xl text-slate-700 leading-relaxed hidden">
                        <!-- Stimulus content diinject di sini -->
                    </div>

                    <!-- Pertanyaan -->
                    <h2 id="question-text" class="text-xl md:text-2xl font-bold text-slate-800 mb-6 leading-snug">
                        <!-- Teks pertanyaan -->
                    </h2>

                    <!-- Pilihan Jawaban -->
                    <div id="options-container" class="flex flex-col gap-4 mt-auto">
                        <!-- Tombol opsi diinject di sini -->
                    </div>
                </div>

                <!-- Footer: Navigasi (tetap di bawah) -->
                <div class="mt-6 pt-4 border-t-2 border-slate-100 flex justify-between gap-4 shrink-0">
                    <button onclick="prevQuestion()" id="btn-prev" class="btn-3d btn-3d-yellow px-6 py-3 text-lg flex-1 max-w-[200px]">
                        ◀ Kembali
                    </button>
                    <button onclick="nextQuestion()" id="btn-next" class="btn-3d btn-3d-blue px-6 py-3 text-lg flex-1 max-w-[200px]">
                        Lanjut ▶
                    </button>
                </div>
            </div>
        </div>

        <!-- ================= RESULT SCREEN ================= -->
        <div id="result-screen" class="hidden glass-panel w-full p-8 md:p-12 flex flex-col items-center text-center my-auto">
            <div class="text-6xl mb-4">🏆</div>
            <h2 class="text-3xl md:text-4xl font-black text-slate-800 mb-2">Ujian Selesai!</h2>
            <p class="text-xl text-slate-600 font-bold mb-8">Kerja bagus, <span id="res-nama" class="text-blue-600"></span>!</p>

            <div class="bg-gradient-to-br from-blue-500 to-blue-600 p-8 rounded-3xl shadow-lg border-4 border-white mb-8 w-full max-w-sm relative overflow-hidden">
                <!-- Dekorasi latar -->
                <div class="absolute top-0 right-0 -mr-8 -mt-8 w-32 h-32 rounded-full bg-white opacity-10"></div>
                <div class="absolute bottom-0 left-0 -ml-8 -mb-8 w-24 h-24 rounded-full bg-white opacity-10"></div>
                
                <p class="text-blue-100 font-bold text-lg mb-2 uppercase tracking-wider relative z-10">Nilai Akhir</p>
                <div id="res-score" class="text-7xl font-black text-white relative z-10 drop-shadow-md">100</div>
                <div class="mt-4 flex justify-center gap-4 text-blue-100 font-semibold relative z-10">
                    <div class="bg-black/20 px-3 py-1 rounded-lg">Benar: <span id="res-correct" class="text-white"></span></div>
                    <div class="bg-black/20 px-3 py-1 rounded-lg">Salah: <span id="res-wrong" class="text-white"></span></div>
                </div>
            </div>

            <button onclick="resetApp()" class="btn-3d btn-3d-green px-8 py-4 text-xl">
                🔄 Ulangi Ujian
            </button>
        </div>

    </div>

    <!-- Data dan Logika Aplikasi -->
    <script>
        // --- 1. DATA SOAL ---
        const stimulus1 = "<b>Mengenal Taha</b><br/><br/>Taha adalah anak kelas V SD yang sangat teratur. Setiap kali pulang sekolah, ia tidak pernah membiarkan tas dan sepatu berserakan. Ia langsung mengganti seragamnya, lalu menyusun buku-buku pelajaran di meja belajarnya dengan apik. Selain disiplin, Taha juga dikenal sebagai anak yang periang. Ia suka menyapa teman-temannya dengan senyuman hangat. Namun, ketika ada temannya yang kesulitan memahami pelajaran, Taha dengan tekun dan telaten membantunya hingga paham.";
        const stimulus2 = "<b>Keteguhan Heo</b><br/><br/>Abu vulkanik dari letusan gunung membumbung tinggi menutup langit. Suasana menjadi gelap gulita. Orang-orang berlarian menyelamatkan diri sambil berteriak ketakutan. Di tengah kepanikan itu, Heo tidak memikirkan dirinya sendiri. Ia teringat pada adik dan kedua orang tuanya yang berada di desa sebelah. Tanpa ragu, Heo memacu kudanya sekuat tenaga menembus hujan abu yang makin pekat. Meski matanya perih dan napasnya sesak, ia menolak untuk menyerah demi bertemu kembali dengan keluarganya.";
        const stimulus3 = "Para pelaut tradisional mengarungi samudra luas dengan keras hati demi menghidupi keluarga mereka. Bagi mereka, laut bukanlah ancaman, melainkan jendela ke dunia lain yang penuh dengan pengetahuan dan kehidupan. kisah perjuangan para pelaut ini dicatat secara nyata dalam buku sejarah pelayaran Indonesia.";
        const stimulus4 = "<b>Perpustakaan Mini Dira</b><br/><br/>Dira sangat hobi membaca buku cerita rakyat. Di rumahnya, ia memiliki rak buku kecil yang tertata sangat apik. Setiap kali selesai membaca, Dira selalu menuliskan ringkasan cerita dan pesan moral dalam Jurnal Membaca miliknya. Dira bercita-cita ingin menjadi seorang penulis hebat agar bisa menginspirasi anak-anak lain.";

        const matchingOptions = [
            { id: 'A', text: 'A. Editor' },
            { id: 'B', text: 'B. Sinonim' },
            { id: 'C', text: 'C. Antonim' },
            { id: 'D', text: 'D. Majas Metafora' },
            { id: 'E', text: 'E. Puisi Akrostik' }
        ];

        const trueFalseOptions = [
            { id: 'B', text: 'BENAR (B)' },
            { id: 'S', text: 'SALAH (S)' }
        ];

        const questionsData = [
            // BAGIAN I: PILIHAN GANDA
            {
                type: 'mc', stimulus: stimulus1,
                question: "1. Berdasarkan tindakan Taha dalam cerita di atas, sifat utama yang menggambarkan sosok Taha adalah ...",
                options: [
                    { id: 'A', text: "A. Penakut dan pendiam" },
                    { id: 'B', text: "B. Rapi, disiplin, dan telaten" },
                    { id: 'C', text: "C. Pemarah dan acuh tak acuh" },
                    { id: 'D', text: "D. Suka mengabaikan tugas sekolah" }
                ],
                answer: 'B'
            },
            {
                type: 'mc', stimulus: stimulus1,
                question: "2. Perhatikan kalimat berikut: \"Taha menyusun buku-buku pelajaran di meja belajarnya dengan apik.\"<br/>Antonim dari kata apik pada kalimat tersebut adalah ...",
                options: [
                    { id: 'A', text: "A. Rapi" }, { id: 'B', text: "B. Indah" },
                    { id: 'C', text: "C. Bersih" }, { id: 'D', text: "D. Berantakan" }
                ],
                answer: 'D'
            },
            {
                type: 'mc', stimulus: stimulus2,
                question: "3. Amanat tersirat yang dapat diambil dari kisah keteguhan Heo di atas adalah ...",
                options: [
                    { id: 'A', text: "A. Kita harus selalu panik saat terjadi bencana alam." },
                    { id: 'B', text: "B. Keberanian dan kasih sayang kepada keluarga memberi kekuatan dalam menghadapi cobaan." },
                    { id: 'C', text: "C. Menyerah adalah pilihan terbaik jika menghadapi jalan yang sangat sulit." },
                    { id: 'D', text: "D. Kita tidak perlu memikirkan keselamatan orang lain saat terjadi bahaya." }
                ],
                answer: 'B'
            },
            {
                type: 'mc', stimulus: stimulus2,
                question: "4. Kata \"penyayang\" memiliki kata dasar sayang yang mendapat awalan pe-. Kata berimbuhan pe- yang menyatakan sifat seseorang dalam cerita Heo di atas adalah ...",
                options: [
                    { id: 'A', text: "A. Pelari" }, { id: 'B', text: "B. Pemberani" },
                    { id: 'C', text: "C. Pemukulan" }, { id: 'D', text: "D. Pelabuhan" }
                ],
                answer: 'B'
            },
            {
                type: 'mc', stimulus: null,
                question: "5. Rana dan Rani adalah saudara kembar identik. Meskipun rupa mereka sangat mirip, sifat mereka berbeda. Rana adalah anak yang pendiam dan tenang, sedangkan Rani sangat aktif dan suka berbicara.<br/><br/>Manakah pernyataan berikut yang menunjukkan perbandingan sifat yang benar antara Rana dan Rani?",
                options: [
                    { id: 'A', text: "A. Rana lebih suka tampil di depan umum dibanding Rani." },
                    { id: 'B', text: "B. Rani cenderung tenang saat menghadapi masalah daripada Rana." },
                    { id: 'C', text: "C. Rana lebih banyak berdiam diri, sedangkan Rani lebih komunikatif." },
                    { id: 'D', text: "D. Kedua saudara kembar tersebut memiliki sifat yang persis sama." }
                ],
                answer: 'C'
            },
            {
                type: 'mc', stimulus: stimulus3,
                question: "6. Kalimat tersebut menggunakan majas metafora \"keras hati\". Makna tersirat dari kata keras hati pada teks di atas adalah ...",
                options: [
                    { id: 'A', text: "A. Suka marah dan kasar" },
                    { id: 'B', text: "B. Teguh pendirian dan pantang menyerah" },
                    { id: 'C', text: "C. Hatinya membatu karena sedih" },
                    { id: 'D', text: "D. Tidak mau mendengar nasehat orang lain" }
                ],
                answer: 'B'
            },
            {
                type: 'mc', stimulus: null,
                question: "7. Teks yang memuat kisah sejarah pelayaran berdasarkan fakta dan kejadian nyata dinamakan teks ...",
                options: [
                    { id: 'A', text: "A. Fiksi" }, { id: 'B', text: "B. Nonfiksi" },
                    { id: 'C', text: "C. Dongeng" }, { id: 'D', text: "D. Mitos" }
                ],
                answer: 'B'
            },
            {
                type: 'mc', stimulus: null,
                question: "8. Dalam proses penerbitan buku, seorang ilustrator bertugas untuk ...",
                options: [
                    { id: 'A', text: "A. Memeriksa kesalahan ejaan dan tata bahasa pada naskah" },
                    { id: 'B', text: "B. Menuliskan isi seluruh cerita dari awal sampai akhir" },
                    { id: 'C', text: "C. Membuat gambar visual yang memperjelas dan memperindah cerita" },
                    { id: 'D', text: "D. Menjual dan mendistribusikan buku ke toko-toko buku" }
                ],
                answer: 'C'
            },
            {
                type: 'mc', stimulus: null,
                question: "9. Bacalah kalimat berikut!<br/>\"Karena penebangan hutan secara liar terus terjadi di hulu sungai, saat hujan deras turun pemukiman warga dilanda banjir bandang.\"<br/><br/>Akibat utama dari peristiwa dalam kalimat di atas adalah ...",
                options: [
                    { id: 'A', text: "A. Penebangan hutan secara liar" },
                    { id: 'B', text: "B. Hujan deras turun di hulu sungai" },
                    { id: 'C', text: "C. Warga menebang pohon di hutan" },
                    { id: 'D', text: "D. Pemukiman warga dilanda banjir bandang" }
                ],
                answer: 'D'
            },
            {
                type: 'mc', stimulus: null,
                question: "10. Membaca buku secara rutin dapat membuka wawasan kita tentang berbagai hal di dunia. Dengan membaca, otak terbiasa mengolah informasi dan bernalar secara kritis. Oleh karena itu, buku sering disebut sebagai jendela dunia.<br/><br/>Ide pokok dari paragraf di atas adalah ...",
                options: [
                    { id: 'A', text: "A. Cara membeli buku di perpustakaan" },
                    { id: 'B', text: "B. Otak manusia tidak membutuhkan bacaan" },
                    { id: 'C', text: "C. Manfaat penting membaca buku bagi peningkatan wawasan" },
                    { id: 'D', text: "D. Buku hanya berguna untuk anak sekolah" }
                ],
                answer: 'C'
            },
            // BAGIAN II: MENJODOHKAN
            {
                type: 'match', stimulus: "<div class='text-center font-bold mb-2'>BAGIAN II: MENJODOHKAN</div>Jodohkanlah pernyataan di bawah ini dengan pilihan jawaban yang tepat!",
                question: "11. Kata yang memiliki persamaan arti dengan kata lain.",
                options: matchingOptions, answer: 'B'
            },
            {
                type: 'match', stimulus: null,
                question: "12. Kata atau kelompok kata yang artinya tidak sebenarnya (kiasan).",
                options: matchingOptions, answer: 'D'
            },
            {
                type: 'match', stimulus: null,
                question: "13. Profesi yang bertugas menyunting naskah dan memperbaiki kesalahan tata bahasa sebelum diterbitkan.",
                options: matchingOptions, answer: 'A'
            },
            {
                type: 'match', stimulus: null,
                question: "14. Puisi yang setiap huruf awal lariknya membentuk sebuah kata bermakna.",
                options: matchingOptions, answer: 'E'
            },
            {
                type: 'match', stimulus: null,
                question: "15. Lawan kata dari suatu kata sifat.",
                options: matchingOptions, answer: 'C'
            },
            // BAGIAN III: BENAR / SALAH
            {
                type: 'tf', stimulus: stimulus4,
                question: "16. Dira memiliki kebiasaan menyusun buku-bukunya dengan berantakan.",
                options: trueFalseOptions, answer: 'S'
            },
            {
                type: 'tf', stimulus: stimulus4,
                question: "17. Buku yang sering dibaca oleh Dira adalah jenis teks cerita rakyat.",
                options: trueFalseOptions, answer: 'B'
            },
            {
                type: 'tf', stimulus: stimulus4,
                question: "18. Menuliskan hasil bacaan ke dalam Jurnal Membaca membantu Dira memahami isi cerita dengan lebih baik.",
                options: trueFalseOptions, answer: 'B'
            },
            {
                type: 'tf', stimulus: stimulus4,
                question: "19. Cita-cita Dira adalah menjadi seorang ilustrator buku anak-anak.",
                options: trueFalseOptions, answer: 'S'
            },
            {
                type: 'tf', stimulus: stimulus4,
                question: "20. Cerita rakyat tergolong sebagai teks nonfiksi karena ditulis berdasarkan data ilmiah.",
                options: trueFalseOptions, answer: 'S'
            }
        ];

        // --- 2. STATE APLIKASI ---
        let studentData = { name: '', absen: '' };
        let currentQuestionIndex = 0;
        let userAnswers = new Array(questionsData.length).fill(null);
        let timerInterval = null;
        const TIME_PER_QUESTION = 120; // 120 detik = 2 menit
        let timeLeft = TIME_PER_QUESTION;

        // --- 3. DOM ELEMENTS ---
        const screens = {
            start: document.getElementById('start-screen'),
            exam: document.getElementById('exam-screen'),
            result: document.getElementById('result-screen')
        };
        const els = {
            inputNama: document.getElementById('input-nama'),
            inputAbsen: document.getElementById('input-absen'),
            soalCounter: document.getElementById('soal-counter'),
            timerDisplay: document.getElementById('timer-display'),
            stimulusContainer: document.getElementById('stimulus-container'),
            questionText: document.getElementById('question-text'),
            optionsContainer: document.getElementById('options-container'),
            btnPrev: document.getElementById('btn-prev'),
            btnNext: document.getElementById('btn-next'),
            resNama: document.getElementById('res-nama'),
            resScore: document.getElementById('res-score'),
            resCorrect: document.getElementById('res-correct'),
            resWrong: document.getElementById('res-wrong')
        };

        // --- 4. FUNGSI LOGIKA ---

        function startExam() {
            const nama = els.inputNama.value.trim();
            const absen = els.inputAbsen.value.trim();

            if (!nama || !absen) {
                alert("Tolong isi Nama dan No. Absen terlebih dahulu ya!"); // Fallback native, tapi UI menghindari kebutuhan ini dg validasi
                els.inputNama.focus();
                return;
            }

            studentData.name = nama;
            studentData.absen = absen;

            screens.start.classList.add('hidden');
            screens.exam.classList.remove('hidden');
            
            currentQuestionIndex = 0;
            renderQuestion();
        }

        function renderQuestion() {
            const q = questionsData[currentQuestionIndex];
            
            // Reset Scroll
            document.getElementById('question-container').scrollTop = 0;

            // Update Counter
            els.soalCounter.innerText = `${currentQuestionIndex + 1}/${questionsData.length}`;

            // Handle Nav Buttons
            els.btnPrev.style.visibility = (currentQuestionIndex === 0) ? 'hidden' : 'visible';
            els.btnNext.innerHTML = (currentQuestionIndex === questionsData.length - 1) ? 'Selesai 🏁' : 'Lanjut ▶';
            els.btnNext.className = (currentQuestionIndex === questionsData.length - 1) 
                ? 'btn-3d btn-3d-green px-6 py-3 text-lg flex-1 max-w-[200px]' 
                : 'btn-3d btn-3d-blue px-6 py-3 text-lg flex-1 max-w-[200px]';

            // Render Stimulus
            if (q.stimulus) {
                els.stimulusContainer.innerHTML = q.stimulus;
                els.stimulusContainer.classList.remove('hidden');
            } else {
                els.stimulusContainer.classList.add('hidden');
                els.stimulusContainer.innerHTML = '';
            }

            // Render Question
            els.questionText.innerHTML = q.question;

            // Render Options
            els.optionsContainer.innerHTML = '';
            q.options.forEach(opt => {
                const isSelected = userAnswers[currentQuestionIndex] === opt.id;
                const btnClass = isSelected ? 'btn-3d btn-option btn-option-selected w-full px-6 py-4' : 'btn-3d btn-option w-full px-6 py-4';
                
                const btn = document.createElement('button');
                btn.className = btnClass;
                btn.innerHTML = `<span class="font-bold text-lg">${opt.text}</span>`;
                btn.onclick = () => selectOption(opt.id);
                els.optionsContainer.appendChild(btn);
            });

            // Start/Reset Timer
            resetTimer();
        }

        function selectOption(optionId) {
            userAnswers[currentQuestionIndex] = optionId;
            // Re-render only options to show selection
            const q = questionsData[currentQuestionIndex];
            els.optionsContainer.innerHTML = '';
            q.options.forEach(opt => {
                const isSelected = userAnswers[currentQuestionIndex] === opt.id;
                const btnClass = isSelected ? 'btn-3d btn-option btn-option-selected w-full px-6 py-4' : 'btn-3d btn-option w-full px-6 py-4';
                
                const btn = document.createElement('button');
                btn.className = btnClass;
                btn.innerHTML = `<span class="font-bold text-lg">${opt.text}</span>`;
                btn.onclick = () => selectOption(opt.id);
                els.optionsContainer.appendChild(btn);
            });
        }

        function nextQuestion() {
            if (currentQuestionIndex < questionsData.length - 1) {
                currentQuestionIndex++;
                renderQuestion();
            } else {
                finishExam();
            }
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                renderQuestion();
            }
        }

        // --- 5. TIMER LOGIC ---
        function resetTimer() {
            clearInterval(timerInterval);
            timeLeft = TIME_PER_QUESTION;
            updateTimerUI();
            
            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerUI();
                
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    // Time's up for this question, auto next
                    nextQuestion();
                }
            }, 1000);
        }

        function updateTimerUI() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            els.timerDisplay.innerText = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            
            if (timeLeft <= 10) {
                els.timerDisplay.classList.add('timer-critical');
            } else {
                els.timerDisplay.classList.remove('timer-critical');
            }
        }

        // --- 6. SCORING & RESULT ---
        function finishExam() {
            clearInterval(timerInterval);
            screens.exam.classList.add('hidden');
            screens.result.classList.remove('hidden');

            let correctCount = 0;
            for (let i = 0; i < questionsData.length; i++) {
                if (userAnswers[i] === questionsData[i].answer) {
                    correctCount++;
                }
            }

            const totalQuestions = questionsData.length;
            const wrongCount = totalQuestions - correctCount;
            // Rumus: (Benar / Total) * 100
            const score = Math.round((correctCount / totalQuestions) * 100);

            els.resNama.innerText = studentData.name;
            els.resScore.innerText = score;
            els.resCorrect.innerText = correctCount;
            els.resWrong.innerText = wrongCount;
        }

        function resetApp() {
            studentData = { name: '', absen: '' };
            currentQuestionIndex = 0;
            userAnswers = new Array(questionsData.length).fill(null);
            
            els.inputNama.value = '';
            els.inputAbsen.value = '';
            
            screens.result.classList.add('hidden');
            screens.start.classList.remove('hidden');
        }

    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Ujian Interaktif - SDN 4 Rambutan</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f3f4f6; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const questions = [
            // ================= BAGIAN A: PILIHAN GANDA (Bobot: 5) =================
            {
                id: 1, section: "A", weight: 5,
                stimulus: "Pada perumusan dasar negara Indonesia, BPUPKI menggelar sidang pertama pada 29 Mei – 1 Juni 1945. Tokoh-tokoh bangsa menyampaikan gagasan dasar negara. Selanjutnya dibentuk Panitia Sembilan yang berhasil menyusun Piagam Jakarta pada tanggal 22 Juni 1945. Setelah melalui musyawarah dan penyesuaian demi menjaga persatuan bangsa, Pancasila disahkan secara resmi sebagai dasar negara oleh PPKI pada tanggal 18 Agustus 1945.",
                text: "1. Berdasarkan narasi di atas, jarak waktu antara perumusan Rancangan Piagam Jakarta oleh Panitia Sembilan hingga pengesahan resmi Pancasila oleh PPKI adalah ....",
                options: ["22 hari", "57 hari", "81 hari", "2 bulan 18 hari"],
                answer: 1 // B. 57 hari
            },
            {
                id: 2, section: "A", weight: 5,
                stimulus: "Kelas V SDN 4 Rambutan mengadakan pemilihan ketua kelas secara demokratis. Hasil penghitungan suara (tally) dicatat pada papan tulis sebagai berikut:\n- Kadir: 15 suara\n- Yamid: 10 suara\n- Ona: 13 suara\nTotal peserta didik yang memberikan suara adalah 38 orang.",
                text: "2. Berdasarkan data di atas, kesimpulan hasil musyawarah dan sikap berpancasila yang wajib ditunjukkan oleh seluruh siswa Kelas V adalah ....",
                options: [
                    "Kadir terpilih menjadi ketua kelas karena unggul 5 suara dari Yamid, dan para calon lain harus saling bekerja sama.",
                    "Ona terpilih menjadi ketua kelas karena meraih suara terbanyak kedua.",
                    "Pemilihan harus diulang karena jumlah suara Kadir kurang dari setengah total pemilih (38 suara).",
                    "Yamid tidak perlu menerima hasil keputusan karena selisih suaranya terlalu jauh."
                ],
                answer: 0 // A
            },
            {
                id: 3, section: "A", weight: 5,
                text: "3. Saat penyusunan Piagam Jakarta pada 22 Juni 1945, terdapat perbedaan pendapat mengenai rumusan sila pertama. Para perumus Pancasila sepakat mengutamakan persatuan nasional di atas kepentingan kelompok sehingga menyetujui perubahan rumusan sila pertama menjadi \"Ketuhanan Yang Maha Esa\". Sikap perumus Pancasila yang wajib kita teladani dalam kehidupan sehari-hari adalah ....",
                options: [
                    "Mempertahankan pendapat pribadi hingga semua orang mengalah",
                    "Berjiwa besar, bertoleransi, dan mendahulukan kepentingan bersama",
                    "Menolak hasil musyawarah jika tidak sesuai dengan keinginan diri sendiri",
                    "Mengikuti pendapat mayoritas hanya jika mendapatkan keuntungan pribadi"
                ],
                answer: 1 // B
            },
            {
                id: 4, section: "A", weight: 5,
                text: "4. Ketika bencana banjir menimpa warga sekitar sekolah, siswa kelas V SDN 4 Rambutan mengumpulkan sumbangan sukarela (Sila ke-2), berdoa bersama untuk keselamatan korban (Sila ke-1), dan menyalurkan bantuan secara gotong royong tanpa membedakan suku (Sila ke-3). Hal ini membuktikan bahwa sila-sila dalam Pancasila ....",
                options: [
                    "Dapat diterapkan secara terpisah sesuai kebutuhan situasi",
                    "Merupakan satu kesatuan utuh yang saling berkaitan dan menjiwai satu sama lain",
                    "Hanya sila kedua yang paling penting diterapkan dalam aksi sosial",
                    "Berdiri sendiri-sendiri tanpa ada hubungan antarsila"
                ],
                answer: 1 // B
            },
            {
                id: 5, section: "A", weight: 5,
                stimulus: "Warga Desa Rambutan mengadakan gotong royong membersihkan saluran air. Kegiatan dimulai pukul 07.00 WIB dan selesai pukul 10.00 WIB. Dari total 60 KK warga, sebanyak 45 KK hadir bergotong royong, sedangkan sisanya berhalangan karena sakit dan memberikan bantuan makanan.",
                text: "5. Persentase tingkat partisipasi warga yang hadir langsung dalam kegiatan gotong royong tersebut serta nilai Pancasila yang tercermin adalah ....",
                options: [
                    "50% - Nilai Keadilan Sosial",
                    "65% - Nilai Persatuan Indonesia",
                    "75% - Nilai Persatuan dan Gotong Royong",
                    "80% - Nilai Kerakyatan"
                ],
                answer: 2 // C
            },
            {
                id: 6, section: "A", weight: 5,
                text: "6. Setiap berangkat sekolah, Ani selalu mencium tangan orang tuanya dan mengucapkan salam. Di jalan raya, ayah Ani memakai helm standar dan berhenti saat lampu lalu lintas berwarna merah. Secara berurutan, norma yang diterapkan oleh Ani dan Ayahnya adalah norma ....",
                options: [
                    "Kesopanan dan Norma Hukum",
                    "Kesusilaan dan Norma Agama",
                    "Agama dan Norma Kesopanan",
                    "Hukum dan Norma Kesusilaan"
                ],
                answer: 0 // A
            },
            {
                id: 7, section: "A", weight: 5,
                stimulus: "Alokasi waktu harian Dodi setelah pulang sekolah (14.00 – 20.00 / 6 jam):\n- Bermain game: 3 jam\n- Membantu orang tua: 30 menit\n- Mengerjakan PR dan belajar: 1 jam\n- Istirahat dan mandi: 1,5 jam",
                text: "7. Analisis yang tepat mengenai pemenuhan hak dan pelaksanaan kewajiban Dodi sebagai anak adalah ....",
                options: [
                    "Dodi sudah seimbang karena waktu bermain game sama dengan waktu belajarnya.",
                    "Dodi belum seimbang karena porsi waktu bermain game (50% dari waktu luang) jauh lebih dominan dibanding kewajiban belajar dan membantu orang tua.",
                    "Dodi tidak mendapatkan haknya untuk menikmati waktu luang bersama keluarga.",
                    "Dodi telah melaksanakan kewajibannya melebihi hak yang diterimanya di rumah."
                ],
                answer: 1 // B
            },
            {
                id: 8, section: "A", weight: 5,
                text: "8. Di perpustakaan SDN 4 Rambutan, Riko menemukan uang jatuh sebesar Rp20.000,00. Meskipun tidak ada orang yang melihat, Riko tidak mengambil uang tersebut melainkan menyerahkannya kepada petugas perpustakaan. Tindakan Riko didasari oleh dorongan hati nurani yang mencerminkan pelaksanaan norma ....",
                options: ["Kesopanan", "Kesusilaan", "Hukum", "Agama"],
                answer: 1 // B
            },
            {
                id: 9, section: "A", weight: 5,
                text: "9. Kelompok belajar Sintia mengalami perdebatan sengit saat menentukan tema kliping Pendidikan Pancasila. Dua anggota kelompok saling memaksakan kehendaknya. Langkah terbaik yang harus diambil Sintia sesuai prinsip musyawarah Pancasila adalah ....",
                options: [
                    "Menghentikan kerja kelompok dan melaporkan teman-temannya ke kepala sekolah",
                    "Mengambil keputusan sendiri tanpa memedulikan anggota kelompok yang lain",
                    "Mengajak seluruh anggota duduk bersama, mendengarkan alasan tiap usulan, dan mencari kesepakatan bersama secara santun",
                    "Mengikuti usulan anggota yang paling galak agar diskusi cepat selesai"
                ],
                answer: 2 // C
            },
            {
                id: 10, section: "A", weight: 5,
                text: "10. Dalam sebuah data tata tertib sekolah, tercatat 12 dari 120 siswa kelas V sering terlambat masuk kelas setelah jam istirahat. Jika hal ini dibiarkan, akibat buruk yang terjadi terhadap penerapan norma di sekolah adalah ....",
                options: [
                    "Persentase siswa yang disiplin mencapai 10%, sehingga suasana kelas menjadi tenang.",
                    "Sebanyak 10% siswa melanggar aturan, yang dapat mengganggu hak siswa lain untuk belajar dengan tertib dan nyaman.",
                    "Sekolah akan menghapuskan aturan jam istirahat agar siswa tidak terlambat lagi.",
                    "Hak siswa yang terlambat akan bertambah karena guru memberikan dispensasi khusus."
                ],
                answer: 1 // B
            },

            // ================= BAGIAN B: MENJODOHKAN (Bobot: 4) =================
            {
                id: 11, section: "B", weight: 4,
                text: "11. Tanggal diperingatinya Hari Lahir Pancasila sesuai pidato Ir. Soekarno di sidang BPUPKI.",
                options: ["A. Hak Anak di Sekolah", "B. 1 Juni 1945", "C. Norma Kesopanan", "D. Kewajiban Siswa", "E. Tanggung Jawab"],
                answer: 1 // B
            },
            {
                id: 12, section: "B", weight: 4,
                text: "12. Menjaga kebersihan kelas dengan melaksanakan piket bersama sesuai jadwal.",
                options: ["A. Hak Anak di Sekolah", "B. 1 Juni 1945", "C. Norma Kesopanan", "D. Kewajiban Siswa", "E. Tanggung Jawab"],
                answer: 3 // D
            },
            {
                id: 13, section: "B", weight: 4,
                text: "13. Sesuatu yang layak diterima siswa, seperti mendapatkan bimbingan dan nilai dari guru.",
                options: ["A. Hak Anak di Sekolah", "B. 1 Juni 1945", "C. Norma Kesopanan", "D. Kewajiban Siswa", "E. Tanggung Jawab"],
                answer: 0 // A
            },
            {
                id: 14, section: "B", weight: 4,
                text: "14. Mengucapkan kata \"permisi\" dan membungkukkan badan saat berjalan di depan guru.",
                options: ["A. Hak Anak di Sekolah", "B. 1 Juni 1945", "C. Norma Kesopanan", "D. Kewajiban Siswa", "E. Tanggung Jawab"],
                answer: 2 // C
            },
            {
                id: 15, section: "B", weight: 4,
                text: "15. Hasil keputusan bersama dalam musyawarah wajib dilaksanakan oleh semua peserta dengan rasa ....",
                options: ["A. Hak Anak di Sekolah", "B. 1 Juni 1945", "C. Norma Kesopanan", "D. Kewajiban Siswa", "E. Tanggung Jawab"],
                answer: 4 // E
            },

            // ================= BAGIAN C: BENAR/SALAH (Bobot: 6) =================
            {
                id: 16, section: "C", weight: 6,
                text: "16. Sidang pertama BPUPKI dipimpin oleh Ir. Soekarno untuk mengesahkan UUD NRI Tahun 1945.",
                options: ["BENAR", "SALAH"],
                answer: 1 // SALAH
            },
            {
                id: 17, section: "C", weight: 6,
                text: "17. Melaksanakan hasil keputusan musyawarah dengan ikhlas meskipun pendapat pribadi kita tidak terpilih merupakan cerminan pengamalan sila ke-4 Pancasila.",
                options: ["BENAR", "SALAH"],
                answer: 0 // BENAR
            },
            {
                id: 18, section: "C", weight: 6,
                text: "18. Sanksi bagi seseorang yang melanggar norma kesusilaan adalah hukuman penjara atau denda uang dari pengadilan negara.",
                options: ["BENAR", "SALAH"],
                answer: 1 // SALAH
            },
            {
                id: 19, section: "C", weight: 6,
                text: "19. Membantu orang tua membersihkan tempat tidur dan merapikan kamar setelah bangun adalah bentuk kewajiban anak di lingkungan rumah.",
                options: ["BENAR", "SALAH"],
                answer: 0 // BENAR
            },
            {
                id: 20, section: "C", weight: 6,
                text: "20. Apabila hak dan kewajiban dijalankan secara seimbang, maka kehidupan bermasyarakat akan menjadi harmonis, adil, dan tertib.",
                options: ["BENAR", "SALAH"],
                answer: 0 // BENAR
            }
        ];

        const ExamApp = () => {
            const [hasStarted, setHasStarted] = useState(false);
            const [currentQ, setCurrentQ] = useState(0);
            const [answers, setAnswers] = useState({});
            const [timeLeft, setTimeLeft] = useState(120); // 120 detik (2 menit) per soal
            const [isFinished, setIsFinished] = useState(false);
            const [studentInfo, setStudentInfo] = useState({ name: '', number: '' });

            // Timer Logic
            useEffect(() => {
                if (!hasStarted || isFinished) return;

                const timerId = setInterval(() => {
                    setTimeLeft(prev => {
                        if (prev <= 1) {
                            handleAutoNext();
                            return 120; // reset 2 menit
                        }
                        return prev - 1;
                    });
                }, 1000);

                return () => clearInterval(timerId);
            }, [hasStarted, currentQ, isFinished]);

            const handleAutoNext = () => {
                if (currentQ < questions.length - 1) {
                    setCurrentQ(prev => prev + 1);
                } else {
                    setIsFinished(true);
                }
            };

            const handleNext = () => {
                if (currentQ < questions.length - 1) {
                    setCurrentQ(currentQ + 1);
                    setTimeLeft(120); // Reset timer saat pindah manual
                } else {
                    setIsFinished(true);
                }
            };

            const handlePrev = () => {
                if (currentQ > 0) {
                    setCurrentQ(currentQ - 1);
                    setTimeLeft(120); // Reset timer
                }
            };

            const selectOption = (optIndex) => {
                setAnswers({ ...answers, [currentQ]: optIndex });
            };

            const calculateScore = () => {
                let total = 0;
                questions.forEach((q, index) => {
                    if (answers[index] === q.answer) {
                        total += q.weight;
                    }
                });
                return total;
            };

            const formatTime = (seconds) => {
                const m = Math.floor(seconds / 60);
                const s = seconds % 60;
                return `${m}:${s < 10 ? '0' : ''}${s}`;
            };

            if (!hasStarted) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4">
                        <div className="bg-white p-8 rounded-2xl shadow-xl w-full max-w-2xl text-center">
                            <h1 className="text-2xl font-bold text-gray-800 mb-2">PEMERINTAH KABUPATEN BANYUASIN</h1>
                            <h2 className="text-xl font-semibold text-gray-700">SD NEGERI 4 RAMBUTAN</h2>
                            <p className="text-gray-600 mb-6 font-medium">SUMATIF TENGAH SEMESTER (STS) 1 TAHUN AJARAN 2024/2025</p>
                            
                            <div className="bg-blue-50 p-4 rounded-lg text-left mb-6 border border-blue-200">
                                <p><strong>Mata Pelajaran:</strong> Pendidikan Pancasila</p>
                                <p><strong>Kelas:</strong> V (Lima)</p>
                                <p className="mt-2 text-sm text-red-600 font-semibold">* Aturan: Setiap soal diberi batas waktu 2 menit otomatis.</p>
                            </div>

                            <div className="flex flex-col gap-4 mb-8">
                                <input 
                                    type="text" placeholder="Masukkan Nama Siswa" 
                                    className="border-2 border-gray-300 p-3 rounded-lg w-full focus:outline-none focus:border-blue-500"
                                    onChange={e => setStudentInfo({...studentInfo, name: e.target.value})}
                                />
                                <input 
                                    type="text" placeholder="Masukkan No. Absen" 
                                    className="border-2 border-gray-300 p-3 rounded-lg w-full focus:outline-none focus:border-blue-500"
                                    onChange={e => setStudentInfo({...studentInfo, number: e.target.value})}
                                />
                            </div>

                            <button 
                                onClick={() => { if(studentInfo.name) setHasStarted(true); else alert('Silakan isi nama terlebih dahulu!'); }}
                                className="bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-12 rounded-full text-xl shadow-lg transition transform hover:scale-105"
                            >
                                MULAI UJIAN
                            </button>
                        </div>
                    </div>
                );
            }

            if (isFinished) {
                const finalScore = calculateScore();
                let message = "";
                if(finalScore >= 85) message = "Luar Biasa! Pertahankan prestasimu.";
                else if(finalScore >= 70) message = "Bagus! Kamu sudah menguasai materi.";
                else message = "Tetap Semangat! Terus belajar dengan giat ya.";

                return (
                    <div className="min-h-screen flex items-center justify-center p-4 fade-in">
                        <div className="bg-white p-8 rounded-2xl shadow-xl w-full max-w-xl text-center">
                            <h2 className="text-3xl font-bold text-gray-800 mb-2">Ujian Selesai!</h2>
                            <p className="text-gray-600 mb-6">Terima kasih, <strong>{studentInfo.name}</strong> (Absen: {studentInfo.number})</p>
                            
                            <div className="bg-blue-600 text-white p-6 rounded-2xl shadow-inner mb-6">
                                <p className="text-lg">Nilai Akhir Kamu</p>
                                <p className="text-6xl font-black mt-2">{finalScore}</p>
                                <p className="text-sm mt-4 bg-white/20 inline-block px-4 py-1 rounded-full">Skor Maksimal: 100</p>
                            </div>
                            
                            <p className="text-lg font-semibold text-gray-700 italic">{message}</p>
                            
                            <button 
                                onClick={() => window.location.reload()}
                                className="mt-8 bg-gray-800 hover:bg-gray-900 text-white py-3 px-8 rounded-full font-semibold transition"
                            >
                                Selesai
                            </button>
                        </div>
                    </div>
                );
            }

            const q = questions[currentQ];

            return (
                <div className="min-h-screen flex flex-col fade-in">
                    {/* Header */}
                    <div className="bg-white shadow-md p-4 sticky top-0 z-10 flex justify-between items-center">
                        <div>
                            <p className="text-sm text-gray-500 font-semibold">Soal {currentQ + 1} dari {questions.length}</p>
                            <p className="font-bold text-blue-600">Bagian {q.section}</p>
                        </div>
                        <div className={`flex items-center gap-2 px-4 py-2 rounded-full font-bold ${timeLeft <= 30 ? 'bg-red-100 text-red-600 animate-pulse' : 'bg-green-100 text-green-700'}`}>
                            ⏱ {formatTime(timeLeft)}
                        </div>
                    </div>

                    {/* Question Content */}
                    <div className="flex-1 w-full max-w-3xl mx-auto p-4 md:p-6 pb-24">
                        <div className="bg-white rounded-2xl shadow-sm p-6 mb-6">
                            {q.stimulus && (
                                <div className="bg-amber-50 p-4 rounded-lg mb-6 border border-amber-200 text-gray-800 text-sm md:text-base leading-relaxed whitespace-pre-wrap">
                                    {q.stimulus}
                                </div>
                            )}
                            
                            <h3 className="text-lg md:text-xl font-medium text-gray-800 leading-relaxed mb-6">
                                {q.text}
                            </h3>

                            <div className="flex flex-col gap-3">
                                {q.options.map((opt, idx) => (
                                    <button
                                        key={idx}
                                        onClick={() => selectOption(idx)}
                                        className={`w-full text-left p-4 rounded-xl border-2 transition-all duration-200 ${
                                            answers[currentQ] === idx 
                                            ? 'border-blue-500 bg-blue-50 text-blue-800 font-medium shadow-md' 
                                            : 'border-gray-200 hover:border-blue-300 hover:bg-gray-50 text-gray-700'
                                        }`}
                                    >
                                        {opt}
                                    </button>
                                ))}
                            </div>
                        </div>
                    </div>

                    {/* Navigation Footer */}
                    <div className="fixed bottom-0 left-0 w-full bg-white border-t border-gray-200 p-4 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
                        <div className="max-w-3xl mx-auto flex justify-between">
                            <button 
                                onClick={handlePrev} 
                                disabled={currentQ === 0}
                                className={`px-6 py-3 rounded-xl font-bold transition ${currentQ === 0 ? 'bg-gray-100 text-gray-400 cursor-not-allowed' : 'bg-gray-200 text-gray-700 hover:bg-gray-300'}`}
                            >
                                ← Kembali
                            </button>
                            
                            <button 
                                onClick={handleNext}
                                className={`px-8 py-3 rounded-xl font-bold shadow-md transition ${
                                    currentQ === questions.length - 1 
                                    ? 'bg-green-500 hover:bg-green-600 text-white' 
                                    : 'bg-blue-600 hover:bg-blue-700 text-white'
                                }`}
                            >
                                {currentQ === questions.length - 1 ? 'Selesai ✔' : 'Lanjut →'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ExamApp />);
    </script>
</body>
</html>

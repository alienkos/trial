    // SOUND SYNTHESIZER (No external MP3 needed, 100% reliable on Smartboard/Mobile)
    // ============================================================================
    const createSoundEngine = () => {
      let ctx = null;
      const init = () => {
        if (!ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) ctx = new AudioCtx();
        }
        if (ctx && ctx.state === 'suspended') ctx.resume();
      };

      const playTone = (freq, type = 'sine', duration = 0.15, delay = 0, vol = 0.15) => {
        try {
          init();
          if (!ctx) return;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, ctx.currentTime + delay);
          gain.gain.setValueAtTime(vol, ctx.currentTime + delay);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + duration);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + delay);
          osc.stop(ctx.currentTime + delay + duration);
        } catch (e) {
          // Ignore audio context restriction errors
        }
      };

      return {
        tap: (enabled) => { if (enabled) playTone(520, 'sine', 0.08, 0, 0.12); },
        success: (enabled) => {
          if (!enabled) return;
          playTone(523.25, 'triangle', 0.15, 0, 0.18);
          playTone(659.25, 'triangle', 0.15, 0.12, 0.18);
          playTone(783.99, 'triangle', 0.25, 0.24, 0.22);
          playTone(1046.5, 'triangle', 0.35, 0.36, 0.22);
        },
        retry: (enabled) => {
          if (!enabled) return;
          playTone(349.23, 'sine', 0.18, 0, 0.15);
          playTone(293.66, 'sine', 0.28, 0.16, 0.15);
        },
        bell: (enabled) => {
          if (!enabled) return;
          playTone(880, 'sine', 0.3, 0, 0.2);
          playTone(1174.66, 'sine', 0.5, 0.2, 0.2);
        },
        tick: (enabled) => { if (enabled) playTone(700, 'square', 0.04, 0, 0.06); }
      };
    };

          acc[stg.id] = stg.durationMinutes * 60;
          return acc;
        }, {})
      );
      const [isTimerRunning, setIsTimerRunning] = useState(false);

      // Toast / Pesan Penyemangat ramah anak (Tanpa alert browser!)

        visible: false,
        title: 'Halo, Anak Cerdas! 👋',
        text: 'Selamat datang di Papan Interaktif Digital (PID) Teladan Hidupku!',
        type: 'info'
      });

      const showCheer = (title, text, type = 'success') => {
        setCheerMessage({ visible: true, title, text, type });
        if (type === 'success') sfx.success(soundEnabled);
        else if (type === 'retry') sfx.retry(soundEnabled);
        else sfx.tap(soundEnabled);
      };

      // Efek Interval Timer Setiap Tahapan
      useEffect(() => {
        if (!isTimerRunning) return;
        const currentStageId = STAGES[activeStageIndex].id;
        const interval = setInterval(() => {
          setStageTimers((prev) => {
            const currentSec = prev[currentStageId];
            if (currentSec <= 1) {
              setIsTimerRunning(false);
              sfx.bell(soundEnabled);
              setCheerMessage({
                visible: true,
                title: '⏰ Waktu Tahap Ini Selesai!',
                text: `Hebat! Waktu untuk ${STAGES[activeStageIndex].title} sudah selesai. Yuk, kita lanjut ke tahap berikutnya!`,
                type: 'info'
              });
              return { ...prev, [currentStageId]: 0 };
            }
            return { ...prev, [currentStageId]: currentSec - 1 };
          });
        }, 1000);
        return () => clearInterval(interval);
      }, [isTimerRunning, activeStageIndex, soundEnabled]);

      // Format MM:SS
      const formatTime = (seconds) => {
        const m = Math.floor(seconds / 60);
        const s = seconds % 60;
        return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
      };

      const resetCurrentTimer = () => {
        const stg = STAGES[activeStageIndex];
        sfx.tap(soundEnabled);
        setIsTimerRunning(false);
        setStageTimers((prev) => ({
          ...prev,
          [stg.id]: stg.durationMinutes * 60
        }));
      };

      // STATE TAHAP PENDAHULUAN (Lagu, Match-Up Tap-to-Select, Pemantik)

      const [sparkSelected, setSparkSelected] = useState(null);

      // STATE TAHAP INTI 1 (Stimulasi Visual & Spidol Digital PID)

        yamin: false,

      const [customStickyInput, setCustomStickyInput] = useState('');

      const [peerCommentInput, setPeerCommentInput] = useState('');

                  id: 'st-' + Date.now(),

                  category: selectedBankItem.category,
                  color: randomColor

          };

        setSelectedBankItem(null);

      // Menambahkan Sticky Note Ketikan Sendiri

        e.preventDefault();

          'bg-sky-200 border-sky-400 text-sky-950',
          'bg-pink-200 border-pink-400 text-pink-950'

        const chosenColor = colors[Math.floor(Math.random() * colors.length)];

        setGroupCanvases((prev) => {
          const current = prev[activeWorkspaceGroup];
          return {
            ...prev,
            [activeWorkspaceGroup]: {
              ...current,
              stickies: [
                ...current.stickies,
                {
                  id: 'cust-' + Date.now(),
                  text: customStickyInput.trim(),
                  category: customCategoryInput,
                  color: chosenColor
                }
              ]
            }
          };
        });
        setCustomStickyInput('');
        showCheer('Karya Hebat! ✨', 'Catatan teladanmu berhasil ditempelkan di kanvas kelompok!', 'success');
      };

      const handleDeleteSticky = (groupKey, stickyId) => {
        sfx.tap(soundEnabled);
        setGroupCanvases((prev) => ({
          ...prev,
          [groupKey]: {
            ...prev[groupKey],
            stickies: prev[groupKey].stickies.filter((s) => s.id !== stickyId)
          }
        }));
      };

      // Menambahkan Stiker Apresiasi pada Tahap 4 Gallery Walk
      const handleAddStickerReaction = (groupKey, stickerType) => {
        setGroupCanvases((prev) => {
          const current = prev[groupKey];
          return {
            ...prev,
            [groupKey]: {
              ...current,
              stickers: {
                ...current.stickers,
                [stickerType]: (current.stickers[stickerType] || 0) + 1
              }
            }
          };
        });
        showCheer('Apresiasi Terkirim! 🌟', 'Terima kasih sudah menghargai karya kelompok temanmu dengan hangat!', 'success');
      };

      const handleAddPeerComment = (e) => {
        e.preventDefault();
        if (!peerCommentInput.trim()) return;
        setGroupCanvases((prev) => {
          const current = prev[zoomFocusGroup];
          return {
            ...prev,
            [zoomFocusGroup]: {
              ...current,
              comments: [...current.comments, peerCommentInput.trim()]
            }
          };
        });
        setPeerCommentInput('');
        showCheer('Komentar Positif Tertempel! 💬', 'Tanggapanmu langsung tampil di layar PID!', 'success');
      };

      // Handler Word Cloud Mentimeter (Tahap Penutup)
      const handleVoteWordCloud = (wordText) => {
        const cleanWord = wordText.trim();
        if (!cleanWord) return;
        setWordCloudItems((prev) => {
          const exists = prev.find((item) => item.word.toLowerCase() === cleanWord.toLowerCase());
          if (exists) {
            return prev.map((item) =>
              item.word.toLowerCase() === cleanWord.toLowerCase()
                ? { ...item, count: item.count + 1 }
                : item
            );
          } else {
            const palette = [
              'text-sky-600 bg-sky-100 border-sky-300',
              'text-emerald-600 bg-emerald-100 border-emerald-300',
              'text-orange-600 bg-orange-100 border-orange-300',
              'text-purple-600 bg-purple-100 border-purple-300'
            ];
            return [
              ...prev,
              {
                word: cleanWord,
                count: 4,
                color: palette[prev.length % palette.length]
              }
            ];
          }
        });
        setReflectionHistory((prev) => [
          { name: studentReflectionName.trim() || 'Anak Cerdas', word: cleanWord },
          ...prev.slice(0, 7)
        ]);
        setCustomReflectionWord('');
        showCheer('Refleksi Masuk ke Awan Kata! ☁️✨', `Hebat! Komitmenmu menerapkan sikap "${cleanWord}" sudah tampil real-time di PID!`, 'success');
      };

      const currentStage = STAGES[activeStageIndex];
      const currentRemainingSec = stageTimers[currentStage.id];
      const totalElapsedPercent = Math.round(
        ((currentStage.durationMinutes * 60 - currentRemainingSec) / (currentStage.durationMinutes * 60)) * 100
      );

      const quizScore = useMemo(() => {
        let correct = 0;
        QUIZ_QUESTIONS.forEach((q) => {
          if (quizAnswers[q.id] === q.correctIndex) correct += 1;
        });
        return correct * 20;
      }, [quizAnswers]);

      return (
        <div className="min-h-screen flex flex-col pb-24">
          {/* ==================================================================== */}
          {/* TOP HEADER & STICKY STAGE DURATION TIMER (2x35 MENIT = 70 MENIT)      */}

                  </div>

                      <span className="px-2.5 py-0.5 text-xs font-extrabold uppercase tracking-wider bg-amber-300 text-slate-900 rounded-full">

                            className="w-full p-2.5 rounded-xl border-2 border-teal-300 bg-white text-xs sm:text-sm font-bold"
                          />

                          <label className="block text-xs font-extrabold uppercase text-teal-800 pt-1">
                            Ketuk Cepat Nilai Keteladanan Pilihanmu:
                          </label>
                          <div className="flex flex-wrap gap-2">
                            {['Musyawarah', 'Gotong Royong', 'Toleransi', 'Rela Berkorban', 'Disiplin', 'Mandiri', 'Menghargai Pendapat'].map((w) => (
                              <button
                                key={w}
                                onClick={() => handleVoteWordCloud(w)}
                                className="px-3 py-2 rounded-xl bg-white hover:bg-teal-600 hover:text-white border-2 border-teal-300 text-teal-900 font-extrabold text-xs transition active:scale-95 shadow-sm"
                              >
                                + {w}
                              </button>
                            ))}
                          </div>

                          <form
                            onSubmit={(e) => {
                              e.preventDefault();
                              handleVoteWordCloud(customReflectionWord);
                            }}
                            className="pt-2 flex gap-2"
                          >
                            <input
                              type="text"
                              value={customReflectionWord}
                              onChange={(e) => setCustomReflectionWord(e.target.value)}
                              placeholder="Atau ketik sikap teladan lainnya..."
                              className="flex-1 p-2.5 rounded-xl border-2 border-teal-300 bg-white text-xs font-bold"
                            />
                            <button
                              type="submit"
                              className="px-4 py-2.5 rounded-xl bg-teal-600 hover:bg-teal-700 text-white font-extrabold text-xs shrink-0"
                            >
                              Kirim 🚀
                            </button>
                          </form>
                        </div>

                        {/* Visualisasi Live Word Cloud di PID */}
                        <div className="lg:col-span-7 bg-slate-900 rounded-3xl p-5 border-4 border-teal-400 flex flex-col justify-between">
                          <div className="flex items-center justify-between text-xs text-teal-200 font-bold mb-3">
                            <span>🔴 LIVE WORD CLOUD (AWAN KATA) KELAS V SD</span>
                            <span>Semakin sering dipilih, ukuran kata semakin besar!</span>
                          </div>

                          <div className="flex flex-wrap items-center justify-center gap-3 py-6 px-2 min-h-[200px]">
                            {wordCloudItems.map((item, idx) => {
                              const sizeClass =
                                item.count >= 9
                                  ? 'text-2xl sm:text-3xl px-5 py-2.5'
                                  : item.count >= 7
                                  ? 'text-xl sm:text-2xl px-4 py-2'
                                  : item.count >= 5
                                  ? 'text-base sm:text-lg px-3.5 py-1.5'
                                  : 'text-xs sm:text-sm px-3 py-1';
                              return (
                                <button
                                  key={idx}
                                  onClick={() => handleVoteWordCloud(item.word)}
                                  className={`rounded-2xl border-2 font-display font-bold shadow-md transition transform hover:scale-110 active:scale-95 ${sizeClass} ${item.color}`}
                                >
                                  {item.word} <span className="text-xs opacity-75">({item.count})</span>
                                </button>
                              );
                            })}
                          </div>

                          <div className="border-t border-slate-700 pt-2.5 flex flex-wrap items-center gap-2 text-xs text-slate-300">
                            <span className="font-bold text-amber-300">Baru saja berkomitmen:</span>
                            {reflectionHistory.slice(0, 4).map((rh, i) => (
                              <span key={i} className="px-2.5 py-0.5 rounded-full bg-white/10 text-white">
                                {rh.name}: <strong>{rh.word}</strong>
                              </span>
                            ))}
                          </div>
                        </div>
                      </div>
                    </section>

                    {/* 2. Kuis Evaluasi Singkat (Simulasi Quizizz / Wordwall - 5 Soal C3/C4) */}
                    <section className="bg-white rounded-3xl p-5 sm:p-6 border-4 border-sky-300 shadow-lg">
                      <div className="flex flex-wrap items-center justify-between gap-3 mb-4">
                        <div className="flex items-center gap-3">
                          <span className="w-12 h-12 rounded-2xl bg-sky-100 text-sky-600 flex items-center justify-center text-2xl">
                            🏆
                          </span>
                          <div>
                            <span className="text-xs font-extrabold uppercase text-sky-600">
                              2. Kuis Evaluasi Formatif (5 Soal HOTS C3/C4)
                            </span>
                            <h2 className="text-xl sm:text-2xl font-bold text-slate-800">
                              Uji Pemahaman: Teladan Perumus Pancasila
                            </h2>
                          </div>
                        </div>

                        {quizSubmitted && (
                          <div className="px-4 py-2 rounded-2xl bg-amber-300 text-slate-900 font-display font-bold text-lg shadow">
                            Skor Kelas/Siswa: {quizScore} / 100 🌟
                          </div>
                        )}
                      </div>

                      <div className="space-y-4">
                        {QUIZ_QUESTIONS.map((q, qIndex) => {
                          const selectedOpt = quizAnswers[q.id];
                          const isCorrect = selectedOpt === q.correctIndex;
                          return (
                            <div key={q.id} className="p-4 sm:p-5 rounded-3xl bg-slate-50 border-2 border-slate-200">
                              <div className="flex items-center justify-between gap-2 mb-2">
                                <span className="px-2.5 py-0.5 rounded-full bg-sky-600 text-white text-xs font-extrabold">
                                  Soal #{qIndex + 1}
                                </span>
                                <span className="px-2.5 py-0.5 rounded-full bg-amber-100 text-amber-800 text-xs font-extrabold">
                                  Taksonomi Bloom: {q.level}
                                </span>
                              </div>
                              <p className="font-bold text-sm sm:text-base text-slate-800 mb-3">
                                {q.question}
                              </p>
                              <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                                {q.options.map((opt, optIdx) => {
                                  const isChosen = selectedOpt === optIdx;
                                  let btnStyle = 'bg-white hover:bg-sky-50 border-slate-300 text-slate-700';
                                  if (quizSubmitted) {
                                    if (optIdx === q.correctIndex) {
                                      btnStyle = 'bg-emerald-500 border-emerald-600 text-white shadow';
                                    } else if (isChosen && optIdx !== q.correctIndex) {
                                      btnStyle = 'bg-rose-500 border-rose-600 text-white';
                                    }
                                  } else if (isChosen) {
                                    btnStyle = 'bg-sky-500 border-sky-600 text-white shadow';
                                  }

                                  return (
                                    <button
                                      key={optIdx}
                                      onClick={() => {
                                        sfx.tap(soundEnabled);
                                        setQuizAnswers((prev) => ({ ...prev, [q.id]: optIdx }));
                                      }}
                                      className={`p-3.5 rounded-2xl border-2 text-left text-xs sm:text-sm font-bold transition active:scale-95 ${btnStyle}`}
                                    >
                                      <span className="inline-block w-6 font-extrabold">
                                        {String.fromCharCode(65 + optIdx)}.
                                      </span>
                                      {opt}
                                    </button>
                                  );
                                })}
                              </div>

                              {quizSubmitted && (
                                <div className={`mt-3 p-3 rounded-2xl text-xs sm:text-sm font-bold ${
                                  isCorrect ? 'bg-emerald-100 text-emerald-900' : 'bg-orange-100 text-orange-900'
                                }`}>
                                  {isCorrect ? '✅ Hebat Sekali! ' : '💡 Yuk Perhatikan: '}
                                  {q.explanation}
                                </div>
                              )}
                            </div>
                          );
                        })}
                      </div>

                      <div className="mt-5 flex flex-wrap items-center justify-between gap-3">
                        <button
                          onClick={() => {
                            if (Object.keys(quizAnswers).length < QUIZ_QUESTIONS.length) {
                              showCheer('Masih Ada Soal yang Belum Dijawab! 😊', 'Yuk ketuk jawaban untuk kelima soal di atas terlebih dahulu, kamu pasti bisa!', 'retry');
                              return;
                            }
                            setQuizSubmitted(true);
                            showCheer('Hore! Kuis Selesai Dikerjakan! 🏆', `Skor kamu adalah ${quizScore}/100! Terima kasih sudah belajar dengan semangat hari ini!`, 'success');
                          }}
                          className="px-6 py-3.5 rounded-2xl bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white font-display font-bold text-base shadow-lg transition active:scale-95"
                        >
                          ✅ Periksa Jawaban & Tampilkan Skor di PID
                        </button>

                        {quizSubmitted && (
                          <button
                            onClick={() => {
                              sfx.tap(soundEnabled);
                              setQuizAnswers({});
                              setQuizSubmitted(false);
                            }}
                            className="px-4 py-3 rounded-2xl bg-slate-200 hover:bg-slate-300 text-slate-700 font-extrabold text-xs sm:text-sm"
                          >
                            Ulangi Kuis
                          </button>
                        )}
                      </div>
                    </section>
                  </div>
                )}

                {/* Navigasi Bawah Antar Tahapan */}
                <div className="mt-6 flex items-center justify-between gap-3 bg-white p-4 rounded-3xl border-2 border-sky-200 shadow-md">
                  <button
                    disabled={activeStageIndex === 0}
                    onClick={() => {
                      sfx.tap(soundEnabled);
                      setActiveStageIndex((i) => Math.max(0, i - 1));
                      setIsTimerRunning(false);
                    }}
                    className="px-5 py-3 rounded-2xl bg-slate-100 hover:bg-slate-200 disabled:opacity-40 text-slate-800 font-extrabold text-xs sm:text-sm transition active:scale-95 flex items-center gap-2"
                  >
                    <i className="fa-solid fa-arrow-left"></i>
                    <span>Tahap Sebelumnya</span>
                  </button>

                  <span className="text-xs sm:text-sm font-extrabold text-slate-600 text-center">
                    Tahap {activeStageIndex + 1} dari {STAGES.length}
                  </span>

                  <button
                    disabled={activeStageIndex === STAGES.length - 1}
                    onClick={() => {
                      sfx.tap(soundEnabled);
                      setActiveStageIndex((i) => Math.min(STAGES.length - 1, i + 1));
                      setIsTimerRunning(false);
                    }}
                    className="px-5 py-3 rounded-2xl bg-sky-500 hover:bg-sky-600 disabled:opacity-40 text-white font-extrabold text-xs sm:text-sm shadow transition active:scale-95 flex items-center gap-2"
                  >
                    <span>Tahap Berikutnya</span>
                    <i className="fa-solid fa-arrow-right"></i>
                  </button>
                </div>
              </div>
            ) : (
              /* ================================================================ */
              /* MODE PANDUAN GURU: TP ABCDE, PANDUAN PID, ATP 70 MENIT & RUBRIK  */
              /* ================================================================ */
              <div className="space-y-6">
                {/* 1. Rumusan Tujuan Pembelajaran (TP) dengan ABCDE */}
                <section className="bg-white rounded-3xl p-5 sm:p-6 border-4 border-sky-300 shadow-lg">
                  <div className="flex items-center gap-3 mb-4">
                    <span className="w-12 h-12 rounded-2xl bg-sky-100 text-sky-600 flex items-center justify-center text-2xl">
                      🎯
                    </span>
                    <div>
                      <span className="text-xs font-extrabold uppercase text-sky-600">
                        Bagian 1 • Rumusan Tujuan Pembelajaran Berbasis Taksonomi Bloom
                      </span>
                      <h2 className="text-xl sm:text-2xl font-bold text-slate-800">
                        Rumusan Tujuan Pembelajaran (TP) Format ABCDE
                      </h2>
                    </div>
                  </div>

                  <div className="bg-gradient-to-r from-sky-50 via-amber-50 to-emerald-50 p-4 sm:p-5 rounded-2xl border-2 border-sky-300 mb-5">
                    <h3 className="text-xs font-extrabold uppercase text-sky-800 mb-1">
                      Kalimat Lengkap Tujuan Pembelajaran (TP):
                    </h3>
                    <p className="text-sm sm:text-base font-bold text-slate-800 leading-relaxed">
                      "Melalui kegiatan kajian ketokohan berbasis kolaborasi Papan Interaktif Digital (PID) <span className="px-1.5 py-0.5 rounded bg-amber-300 text-slate-900">(C)</span>, peserta didik kelas V <span className="px-1.5 py-0.5 rounded bg-sky-300 text-slate-900">(A)</span> dapat mengidentifikasi karakter dan nilai perjuangan perumus Pancasila serta menentukan contoh sikap teladan <span className="px-1.5 py-0.5 rounded bg-emerald-300 text-slate-900">(B - C3/C4)</span> dengan tepat dan kritis <span className="px-1.5 py-0.5 rounded bg-purple-300 text-slate-900">(D)</span> sebagai wujud pembentukan karakter Profil Pelajar Pancasila (bernalar kritis, gotong royong, dan mandiri) untuk diterapkan dalam kehidupan sehari-hari <span className="px-1.5 py-0.5 rounded bg-pink-300 text-slate-900">(E)</span>."
                    </p>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-3">
                    {[
                      {
                        letter: 'A',
                        name: 'Audience',
                        desc: 'Peserta didik kelas V SD.',
                        color: 'bg-sky-50 border-sky-300 text-sky-900'
                      },
                      {
                        letter: 'B',
                        name: 'Behavior (C3/C4)',
                        desc: 'Mengidentifikasi karakter/nilai perjuangan serta menentukan contoh sikap teladan perumus Pancasila.',
                        color: 'bg-emerald-50 border-emerald-300 text-emerald-900'
                      },
                      {
                        letter: 'C',
                        name: 'Condition',
                        desc: 'Menggunakan media interaktif pada Papan Interaktif Digital (PID) melalui aplikasi kolaboratif (Canva Whiteboard / Padlet) dan game interaktif (Wordwall).',
                        color: 'bg-amber-50 border-amber-300 text-amber-900'
                      },
                      {
                        letter: 'D',
                        name: 'Degree',
                        desc: 'Tepat dan kritis (minimal mengidentifikasi 3 nilai keteladanan perumus Pancasila beserta contoh penerapannya).',
                        color: 'bg-purple-50 border-purple-300 text-purple-900'
                      },
                      {
                        letter: 'E',
                        name: 'Element (Character)',
                        desc: 'Internalisasi Profil Pelajar Pancasila (bernalar kritis, gotong royong, dan mandiri) dalam kehidupan sehari-hari di rumah dan sekolah.',
                        color: 'bg-pink-50 border-pink-300 text-pink-900'
                      }
                    ].map((item) => (
                      <div key={item.letter} className={`p-4 rounded-2xl border-2 ${item.color}`}>
                        <div className="w-9 h-9 rounded-xl bg-white font-display font-bold text-lg flex items-center justify-center shadow-sm mb-2">
                          {item.letter}
                        </div>
                        <h4 className="font-display font-bold text-sm mb-1">{item.name}</h4>
                        <p className="text-xs font-semibold leading-relaxed">{item.desc}</p>
                      </div>
                    ))}
                  </div>
                </section>

                {/* 2. Panduan Aplikasi & Perangkat Lunak PID yang Digunakan */}
                <section className="bg-white rounded-3xl p-5 sm:p-6 border-4 border-orange-300 shadow-lg">
                  <div className="flex items-center gap-3 mb-4">
                    <span className="w-12 h-12 rounded-2xl bg-orange-100 text-orange-600 flex items-center justify-center text-2xl">
                      🖥️
                    </span>
                    <div>
                      <span className="text-xs font-extrabold uppercase text-orange-600">
                        Bagian 2 • Rekomendasi Kombinasi Perangkat Lunak Smartboard / PID
                      </span>
                      <h2 className="text-xl sm:text-2xl font-bold text-slate-800">
                        Panduan Aplikasi Pendukung Papan Interaktif Digital (PID)
                      </h2>
                    </div>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                    {PID_APPS_GUIDE.map((app, idx) => (
                      <div key={idx} className="rounded-3xl border-2 border-slate-200 p-4 bg-slate-50 flex flex-col justify-between">
                        <div>
                          <div className="flex items-center gap-3 mb-3">
                            <div className={`w-11 h-11 rounded-2xl ${app.color} text-white flex items-center justify-center text-lg shadow`}>
                              <i className={`fa-solid ${app.icon}`}></i>
                            </div>
                            <div>
                              <span className="text-[11px] font-extrabold uppercase text-slate-500">
                                {app.stage}
                              </span>
                              <h3 className="font-display font-bold text-base text-slate-900">
                                {app.name}
                              </h3>
                            </div>
                          </div>
                          <div className="mb-3">
                            <span className="text-xs font-extrabold text-sky-700 block mb-0.5">
                              Fungsi & Bentuk Kegiatan Interaktif:
                            </span>
                            <p className="text-xs font-semibold text-slate-700 leading-relaxed">
                              {app.functionDesc}
                            </p>
                          </div>
                        </div>
                        <div className="p-3 rounded-2xl bg-white border border-slate-200">
                          <span className="text-xs font-extrabold text-emerald-700 block mb-0.5">
                            Akses / Integrasi PID:
                          </span>
                          <p className="text-xs font-semibold text-slate-600">
                            {app.integrationDesc}
                          </p>
                        </div>
                      </div>
                    ))}
                  </div>
                </section>

                {/* 3. Alur Tujuan Pembelajaran (ATP) / Skenario 1 Pertemuan (2x35 Menit) */}
                <section className="bg-white rounded-3xl p-5 sm:p-6 border-4 border-emerald-300 shadow-lg">
                  <div className="flex flex-wrap items-center justify-between gap-2 mb-4">
                    <div className="flex items-center gap-3">
                      <span className="w-12 h-12 rounded-2xl bg-emerald-100 text-emerald-600 flex items-center justify-center text-2xl">
                        ⏱️
                      </span>
                      <div>
                        <span className="text-xs font-extrabold uppercase text-emerald-600">
                          Bagian 3 • Skenario Pembelajaran 1 Pertemuan (2 x 35 Menit = 70 Menit)
                        </span>
                        <h2 className="text-xl sm:text-2xl font-bold text-slate-800">
                          Alur Tujuan Pembelajaran (ATP) Model "Teladan Hidupku"
                        </h2>
                      </div>
                    </div>
                  </div>

                  <div className="space-y-3">
                    {STAGES.map((stg, idx) => (
                      <div key={stg.id} className="p-4 rounded-2xl border-2 border-slate-200 bg-slate-50 flex flex-wrap items-center justify-between gap-3">
                        <div className="flex items-center gap-3">
                          <span className="text-2xl">{stg.emoji}</span>
                          <div>
                            <div className="flex items-center gap-2">
                              <span className={`px-2.5 py-0.5 rounded-full text-xs font-extrabold border ${stg.badgeColor}`}>
                                {stg.durationMinutes} Menit
                              </span>
                              <span className="text-xs font-extrabold text-slate-500">
                                Aplikasi: {stg.appUsed}
                              </span>
                            </div>
                            <h3 className="font-display font-bold text-base text-slate-800 mt-0.5">
                              {stg.title} — {stg.subtitle}
                            </h3>
                          </div>
                        </div>

                        <button
                          onClick={() => {
                            sfx.tap(soundEnabled);
                            setActiveStageIndex(idx);
                            setViewMode('pid_interactive');
                          }}
                          className="px-4 py-2 rounded-xl bg-sky-500 hover:bg-sky-600 text-white font-extrabold text-xs transition active:scale-95"
                        >
                          Buka Simulasi Tahap Ini <i className="fa-solid fa-play ml-1"></i>
                        </button>
                      </div>
                    ))}
                  </div>
                </section>

                {/* 4. Rubrik Asesmen Sikap & Keterampilan/Pengetahuan Interaktif */}
                <section className="bg-white rounded-3xl p-5 sm:p-6 border-4 border-purple-300 shadow-lg">
                  <div className="flex items-center gap-3 mb-4">
                    <span className="w-12 h-12 rounded-2xl bg-purple-100 text-purple-600 flex items-center justify-center text-2xl">
                      📊
                    </span>
                    <div>
                      <span className="text-xs font-extrabold uppercase text-purple-600">
                        Bagian 4 • Instrumen Penilaian Guru Langsung di Layar
                      </span>
                      <h2 className="text-xl sm:text-2xl font-bold text-slate-800">
                        Asesmen Formatif Sikap (P3) & Unjuk Kerja LKPD Digital
                      </h2>
                    </div>
                  </div>

                  <p className="text-xs sm:text-sm text-slate-600 font-semibold mb-4">
                    Ketuk angka skor (1–4) pada tabel di bawah ini untuk memberikan penilaian langsung terhadap proses kolaborasi kelompok di PID:
                  </p>

                  <div className="overflow-x-auto">
                    <table className="w-full text-left border-collapse">
                      <thead>
                        <tr className="bg-purple-100 text-purple-950 text-xs uppercase font-extrabold">
                          <th className="p-3 rounded-tl-2xl">Kelompok Kajian Tokoh</th>
                          <th className="p-3">Sikap: Bernalar Kritis (1-4)</th>
                          <th className="p-3">Sikap: Gotong Royong (1-4)</th>
                          <th className="p-3">LKPD: Ketepatan Karakter (1-4)</th>
                          <th className="p-3">LKPD: Relevansi Contoh (1-4)</th>
                          <th className="p-3 rounded-tr-2xl">Nilai Akhir</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-200 text-xs sm:text-sm font-bold">
                        {FOUNDERS.map((f) => {
                          const sc = rubricScores[f.id];
                          const total = Math.round(((sc.kritis + sc.gotongRoyong + sc.ketepatanKarakter + sc.relevansiContoh) / 16) * 100);
                          return (
                            <tr key={f.id} className="hover:bg-purple-50/50">
                              <td className="p-3 font-display text-slate-900">
                                Kelompok {f.name}
                              </td>
                              {['kritis', 'gotongRoyong', 'ketepatanKarakter', 'relevansiContoh'].map((criteria) => (
                                <td key={criteria} className="p-3">
                                  <div className="flex gap-1">
                                    {[1, 2, 3, 4].map((val) => (
                                      <button
                                        key={val}
                                        onClick={() => {
                                          sfx.tap(soundEnabled);
                                          setRubricScores((prev) => ({
                                            ...prev,
                                            [f.id]: { ...prev[f.id], [criteria]: val }
                                          }));
                                        }}
                                        className={`w-8 h-8 rounded-lg font-extrabold transition ${
                                          sc[criteria] === val
                                            ? 'bg-purple-600 text-white shadow'
                                            : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                                        }`}
                                      >
                                        {val}
                                      </button>
                                    ))}
                                  </div>
                                </td>
                              ))}
                              <td className="p-3">
                                <span className="px-3 py-1 rounded-full bg-emerald-100 text-emerald-800 font-extrabold">
                                  {total} / 100
                                </span>
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                </section>
              </div>
            )}
          </main>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
